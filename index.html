<!DOCTYPE html>
<html lang="en">
<head>
<script>window.ANVIL_PROXY_URL = "https://flayai-agent.flaynity.workers.dev/api/proxy";</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>DevNix AI — Coding Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A0A0A'/%3E%3Cpath d='M8.5 8.5l3.5 3.5-3.5 3.5M13.5 15.5H17' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" onerror="window.__noJsZip=true"></script>
<style>
:root{
  --bg:#FFFFFF; --ink:#0A0A0A; --ink-2:#3F3F46; --ink-3:#52525B; --ink-4:#8E8E96;
  --line:#E8E8EA; --line-2:#D9D9DE; --surface:#FAFAFA; --surface-2:#F4F4F5;
  --ok:#166534; --err:#991B1B; --warn:#92400E; --info:#1D4ED8;
  --code-bg:#101013; --code-ink:#D6D7DC; --code-dim:#4B4E58;
  --r-xl:26px;
  --shadow:0 2px 6px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.09);
  --float-bg:rgba(255,255,255,.88);
  --float-line:rgba(10,10,10,.09);
  --float-blur:blur(16px) saturate(1.35);
  --float-shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --ease:cubic-bezier(.22,.7,.3,1);
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  height:100vh; height:100dvh; overflow:hidden;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button{touch-action:manipulation; font-family:var(--sans)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid #fff}
.code-surface::-webkit-scrollbar-thumb{background:#33343B;border:3px solid var(--code-bg)}
.ic{width:19px;height:19px;flex:none;display:block}
.ic-s{width:15px;height:15px}
.ic-xs{width:13px;height:13px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ FLOATING TOP BAR ITEMS ============ */
.topbar-menu-wrap{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px);
  left:16px; z-index:30;
}
.mbtn{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--float-line);
  background:var(--float-bg); backdrop-filter:var(--float-blur); -webkit-backdrop-filter:var(--float-blur);
  color:var(--ink); display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  box-shadow:var(--float-shadow); transition:background .15s, transform .15s var(--ease), border-color .15s;
}
.mbtn:hover{background:#fff; border-color:var(--ink)}
.mbtn:active{transform:scale(.92)}
.mbtn .ic{width:20px;height:20px}

.topbar-actions-box{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px);
  right:16px; z-index:30;
  display:flex; align-items:center; gap:6px; padding:4px 5px;
  background:var(--float-bg); backdrop-filter:var(--float-blur); -webkit-backdrop-filter:var(--float-blur);
  border:1px solid var(--float-line); border-radius:15px; box-shadow:var(--float-shadow);
}
.dbtn{
  width:38px;height:38px;border-radius:11px;border:none;background:none;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:background .15s,color .15s,transform .15s var(--ease);
}
.dbtn:hover{background:var(--surface-2);color:var(--ink)}
.dbtn:active{transform:scale(.93)}
.dbtn .ic{width:18px;height:18px}
.tbtn{
  height:38px;padding:0 14px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;
  border:none;font-size:13.5px;font-weight:650;cursor:pointer;transition:background .15s,transform .15s var(--ease);
}
.tbtn:active{transform:scale(.96)}
.tbtn-dark{background:var(--ink);color:#fff;box-shadow:0 2px 7px rgba(0,0,0,.15)}
.tbtn-dark:hover{background:#28282D}
@media(max-width:520px){
  .tbtn .lbl{display:none}
  .tbtn{width:38px;justify-content:center;padding:0}
}

/* 3-dot popover */
.pop{
  position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1px solid var(--line);
  border-radius:15px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:none;z-index:35;
}
.pop.on{display:block;animation:pop .16s var(--ease)}
.pi{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:none;background:none;
  border-radius:10px;font:inherit;font-size:13.5px;font-weight:550;cursor:pointer;text-align:left;color:var(--ink);
}
.pi:hover{background:var(--surface)}
.pi .ic{width:16px;height:16px;color:var(--ink-3)}
.pi.danger{color:var(--err)} .pi.danger .ic{color:var(--err)}
.pi.danger:hover{background:#FDF1F1}
.pop-sep{height:1px;background:var(--line);margin:5px 9px}

/* ============ CHAT (full-height, scrolls under floating bars) ============ */
.chat{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:1}
.thread{max-width:780px;margin:0 auto;padding:76px 16px 76px;display:flex;flex-direction:column;gap:30px}
.msg{animation:rise .35s var(--ease)}
.m-user{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.m-user .bubble{
  max-width:86%;background:var(--ink);color:#fff;padding:12px 17px;
  border-radius:22px 22px 7px 22px;font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 2px 8px rgba(0,0,0,.14);
}
.bubble.clamp{display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{
  align-self:flex-end;height:31px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;font-size:12px;font-weight:650;color:var(--ink-2);cursor:pointer;
  transition:border-color .15s,color .15s;
}
.more-btn:hover{border-color:var(--ink);color:var(--ink)}
.m-chips{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:86%}
.mchip{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;
  padding:6px 10px;font-size:12.5px;max-width:100%;background:#fff;
}
.mchip .ic{width:14px;height:14px;color:var(--ink-3)}
.mchip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip.bad{color:var(--err)}
.m-ai{display:flex;flex-direction:column;gap:12px}
.m-label{
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  display:flex;gap:8px;align-items:center;
}
.m-label .ic{width:14px;height:14px}
.m-model{color:var(--ink-4);font-weight:600;letter-spacing:.06em}
.m-meta{font-size:11px;color:var(--ink-4)}

/* prose */
.prose{font-size:15px;line-height:1.7;color:var(--ink);word-break:break-word}
.prose:empty{display:none}
.prose p{margin:0 0 12px}
.prose>:last-child{margin-bottom:0}
.prose h2,.prose h3,.prose h4{margin:18px 0 8px;letter-spacing:-.015em;line-height:1.3}
.prose h2{font-size:19px}.prose h3{font-size:16.5px}.prose h4{font-size:15px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:4px 0}
.prose blockquote{border-left:3px solid var(--line-2);padding-left:13px;color:var(--ink-3);margin:0 0 12px}
.prose a{color:var(--ink)}
.prose code{
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:1.5px 6px;font-family:var(--mono);font-size:.86em;
}
.mdcode{
  background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 16px;
  overflow-x:auto;font-family:var(--mono);font-size:12.8px;line-height:1.6;margin:0 0 12px;white-space:pre;
}
.prose hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.prose table{border-collapse:collapse;margin:0 0 12px;font-size:13.5px;max-width:100%;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
.prose th{background:var(--surface);font-weight:650}

/* thought process */
.thought{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.th-head{
  display:flex;align-items:center;gap:9px;width:100%;padding:11px 13px;background:none;border:none;
  font:inherit;cursor:pointer;min-height:44px;
}
.th-head:hover{background:var(--surface)}
.th-ic{color:var(--ink-3);display:flex}
.th-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.th-live{
  margin-left:auto;font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center;
  min-width:0;white-space:nowrap;overflow:hidden;
}
.th-live .txt{overflow:hidden;text-overflow:ellipsis}
.th-chev{color:var(--ink-4);display:flex;transition:transform .2s var(--ease)}
.thought.open .th-chev{transform:rotate(180deg)}
.th-body{display:none;border-top:1px solid var(--line);padding:7px 14px 10px;max-height:232px;overflow:auto}
.thought.open .th-body{display:block;animation:fade .2s}
.ev{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:13px;color:var(--ink-2)}
.ev .st{width:15px;height:15px;flex:none;margin-top:2px;color:var(--ink)}
.ev .st .ic{width:15px;height:15px}
.ev.error{color:var(--err)} .ev.error .st{color:var(--err)}
.ev .det{color:var(--ink-4);font-size:12px;margin-left:6px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:pulse 1.1s ease-in-out infinite;flex:none;margin:4px 3.5px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* agent cards */
.acard{border:1px solid var(--line);border-radius:15px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.acard-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.acard-ic .ic{width:17px;height:17px}
.acard-t{font-size:13.5px;font-weight:660}
.acard-s{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.acard-st{margin-left:auto;flex:none;color:var(--ink-3);display:flex;align-items:center}
.alink{width:2px;height:14px;background:var(--line-2);margin-left:24px}
.findings{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.finding{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px}
.finding .fic{color:var(--warn);flex:none;margin-top:1px;display:flex}
.finding b{font-weight:650}

/* file cards */
.fgroup{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.fgroup-h{
  display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
}
.fgroup-h .ic{width:14px;height:14px}
.fcard{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:#fff;border:none;
  border-bottom:1px solid var(--line);font:inherit;text-align:left;cursor:pointer;transition:background .15s;min-height:62px;
}
.fcard:last-child{border-bottom:none}
.fcard:hover{background:var(--surface)}
.fcard:active{background:var(--surface-2)}
.fcard.dead{cursor:default}
.fcard-ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.fcard-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fcard-top{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.fcard-name{font-size:13.5px;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.fcard-st{flex:none;color:var(--ink-3);display:flex;align-items:center}
.bdg{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;border:1px solid var(--line-2);color:var(--ink-3)}
.bdg.add{color:var(--ok);border-color:#CBE3D2}
.bdg.mod{color:var(--warn);border-color:#EAD9C0}
.bdg.fail{color:var(--err);border-color:#EFCBCB}
.dots::after{content:'';animation:dots 1.2s steps(1,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:rot .7s linear infinite;flex:none}
.spin.sm{width:13px;height:13px}
@keyframes rot{to{transform:rotate(360deg)}}

/* extras */
.extras-slot{display:flex;flex-direction:column;gap:10px}
.notice{border:1px solid var(--line);border-left:3px solid var(--err);border-radius:13px;padding:12px 14px;background:#fff}
.notice.warn{border-left-color:var(--warn)}
.notice-h{font-size:13.5px;font-weight:650;display:flex;gap:9px;align-items:center}
.notice-h .ic{color:var(--err)}
.notice.warn .notice-h .ic{color:var(--warn)}
.notice-b{font-size:13px;color:var(--ink-3);margin-top:4px}
.notice-a{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.vline{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.vline .ic{width:14px;height:14px;color:var(--ok)}
.vline.has-warn .ic{color:var(--warn)}
.act-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  height:40px;padding:0 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,border-color .15s,transform .1s;
}
.btn:active{transform:scale(.98)}
.btn-ghost{border-color:var(--line-2);color:var(--ink);background:#fff}
.btn-ghost:hover{border-color:var(--ink)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#28282D}
.btn-danger{background:var(--err);color:#fff}
.btn-danger:hover{background:#7F1D1D}
.btn-sm{height:34px;padding:0 13px;font-size:13px;border-radius:9px}
.copy-ok{color:var(--ok)!important;border-color:#BFD9C8!important}

/* ============ EMPTY STATE (POSITIONED CRISPLY UNDER TOP BUTTONS) ============ */
.empty{
  max-width:780px;margin:0 auto;
  padding:64px 20px 30px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  animation:rise .4s var(--ease);
}
.mark{
  width:46px;height:46px;border-radius:14px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.15);
}
.mark .ic{width:22px;height:22px}
.empty h1{font-size:clamp(26px,5.8vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.empty h1 em{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:500}
.empty p{margin-top:10px;font-size:14.5px;color:var(--ink-3);max-width:440px;line-height:1.6}
.qa-wrap{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.qa{
  height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;
  font-size:12.8px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;
  gap:8px;transition:border-color .15s,color .15s,background .15s,transform .1s;
}
.qa:hover{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.qa:active{transform:scale(.97)}
.setup-cta{margin-top:22px}

/* ============ FLOATING COMPOSER ============ */
.composer-wrap{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  left:50%;transform:translateX(-50%);width:min(780px,calc(100% - 24px));z-index:30;
}
.composer-inner{position:relative}
.fab{
  position:absolute;top:-56px;right:2px;width:40px;height:40px;border-radius:50%;background:#fff;
  border:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);animation:pop .18s var(--ease);
}
.tray{display:flex;flex-direction:column;gap:8px;margin-bottom:9px}
.chip{
  display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:15px;padding:8px 10px;
  background:rgba(255,255,255,.94);backdrop-filter:var(--float-blur);-webkit-backdrop-filter:var(--float-blur);
  box-shadow:0 1px 3px rgba(0,0,0,.05);animation:rise .25s var(--ease);
}
.chip-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.chip-ic .ic{width:17px;height:17px}
.chip-m{flex:1;min-width:0}
.chip-n{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-s{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.chip-s.err{color:var(--err)}
.chip-x{width:30px;height:30px;border-radius:8px;border:none;background:none;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.chip-x:hover{background:var(--surface-2);color:var(--err)}
.chip-x .ic{width:14px;height:14px}
.composer{
  background:var(--float-bg); backdrop-filter:var(--float-blur); -webkit-backdrop-filter:var(--float-blur);
  border:1px solid var(--float-line); border-radius:var(--r-xl);
  box-shadow:var(--float-shadow); transition:border-color .18s, box-shadow .18s;
}
.composer:focus-within{border-color:rgba(10,10,10,.5);box-shadow:0 1px 2px rgba(0,0,0,.05),0 16px 44px rgba(0,0,0,.15)}
#input{
  display:block;width:100%;border:none;outline:none;resize:none;background:none;font-family:var(--sans);
  font-size:15.5px;line-height:1.5;padding:15px 18px 5px;max-height:260px;overflow-y:auto;color:var(--ink);
}
#input::placeholder{color:var(--ink-4)}
.composer-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 9px 9px 11px}
.cb-left{display:flex;align-items:center;gap:2px}
.cb-right{display:flex;align-items:center;gap:7px}
.cbtn{
  width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:none;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s;flex:none;
}
.cbtn:hover{background:var(--surface-2);color:var(--ink)}
.cbtn.on{background:var(--ink);color:#fff}
.think-wrap{position:relative}
.pill{
  height:37px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);
  font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
}
.pill:hover{border-color:var(--ink);color:var(--ink)}
.pill .ic{width:15px;height:15px}
.pill .chev{width:13px;height:13px;color:var(--ink-4)}
.menu{
  position:absolute;bottom:calc(100% + 10px);right:0;background:#fff;border:1px solid var(--line);
  border-radius:15px;box-shadow:var(--shadow);padding:5px;min-width:236px;z-index:35;display:none;
}
.menu.on{display:block;animation:pop .16s var(--ease)}
.mi{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:none;background:none;
  border-radius:9px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;
}
.mi:hover{background:var(--surface)}

===================================================================== */
const CODE_STORE = new Map();
function extractFences(text) {

}
function fencePath(info) {

}
function fenceLang(info, path) {

  if (path) return extOf(path);

}

}

}
function mdToHtml(text, final) {

  let para = [];

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushP(para); para = []; const lv = Math.min(h[1].length + 1, 6); out.push('<h' + lv + '>' + inlineMd(h[2]) + '</h' + lv + '>'); i++; continue; }
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flushP(para); para = []; out.push('<hr>'); i++; continue; }
    if (/^\s*&gt;/.test(line)) {

      for (let r = 2; r < rows.length; r++) t += '<tr>' + cells(rows[r]).map(c => '<td>' + c + '</td>').join('') + '</tr>';

    }
    const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      flushP(para); para = [];
      const ordered = /\d/.test(li[2]);

        const m2 = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m2) { items.push({ indent: m2[1].length, text: m2[3] }); i++; }
        else if (/^\s*\S/.test(lines[i]) && items.length && !/^(#{1,6})\s|^\s*(?:-{3,})/.test(lines[i])) { items[items.length - 1].text += ' ' + lines[i].trim(); i++; }

        let html2 = ordered && ind === 0 && /\d/.test(li[2]) ? '<ol>' : '<ul>';

        while (k < arr.length) {

        }

        html2.__next = k;
        return html2;
      };
      out.push(renderItems(items, 0, items[0].indent));
      continue;
    }
    para.push(line); i++;
  }
  flushP(para);
  let html = out.join('\n');
  html = html.replace(/<p>\u0000F(\d+)\u0000<\/p>/g, (m, idx) => fenceBlockHtml(+idx, fences, final));
  html = html.replace(/\u0000F(\d+)\u0000/g, (m, idx) => fenceBlockHtml(+idx, fences, final));
  return html;
}

let saveTimer = null;

      model: m.model || null,
      attachments: (m.attachments || []).map(a => ({ name: a.name, size: a.size, kind: a.kind, path: a.path })),
      files: (m.files || []).map(f => ({ ...f })),
      error: m.error ? { title: m.error.title, detail: (m.error.detail || '').slice(0, 2000) } : null,
      stopped: !!m.stopped

    const chat = {
      id: state.activeChatId, title: (state.chatHistory.find(c => c.id === state.activeChatId) || {}).title || 'New chat',
      ts: Date.now(), msgs: state.messages.map(serMsg)
    };
    const chats = [chat, ...state.chatHistory.filter(c => c.id !== chat.id)].slice(0, CFG.MAX_CHATS);
    const proj = {
      name: state.project.name,
      files: state.project.files.slice(0, 80).map(f => ({
        path: f.path, size: f.size, ts: f.ts, dataUrl: f.dataUrl && f.dataUrl.length < 400000 ? f.dataUrl : null,
        content: f.content != null ? f.content.slice(0, CFG.STORE_FILE_CAP) : ''
      }))

    const payload = { v: 1, providers: state.providers, activeProvider: state.activeProvider, activeModel: state.activeModel,
      deepThink: state.deepThink, webSearch: state.webSearch, project: proj, chats };
    for (let attempt = 0; attempt < 4; attempt++) {
      try { localStorage.setItem(CFG.KEY, JSON.stringify(payload)); return; }
      catch (e) {
        if (chats.length > 1) chats.pop();
        else { proj.files = proj.files.slice(0, Math.floor(proj.files.length / 2)); payload.project = proj; if (!proj.files.length) return; }
      }
    }
  }, 350);
}
function loadPersisted() {
  try {
    const raw = localStorage.getItem(CFG.KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    state.providers = Array.isArray(d.providers) ? d.providers : [];
    state.activeProvider = d.activeProvider || null;
    state.activeModel = d.activeModel || null;
    state.deepThink = THINK_LEVELS.some(l => l.id === d.deepThink) ? d.deepThink : 'balanced';
    state.webSearch = !!d.webSearch;
    if (d.project && Array.isArray(d.project.files)) state.project = { name: d.project.name || null, files: d.project.files.filter(f => f && f.path) };
    state.chatHistory = Array.isArray(d.chats) ? d.chats : [];

    if (cur) {
      state.activeChatId = cur.id;

    }

}

  }

}

  }

}

function classifyTask(text) {
  const t = String(text || '').toLowerCase();

  if (/\b(analyz|explain|review|what does|how does|understand|audit)\b/.test(t)) return 'analyze';
  if (/\b(build|create|make|generate|implement|add a new|new (page|feature|site|app|component))\b/.test(t)) return 'create';
  if (/\b(change|update|refactor|modify|rename|move|edit|replace|remove|delete)\b/.test(t)) return 'modify';

}

function friendlyError(status, detail, netErr) {

===================================================================== */
function parseFilesFromText(text) {
  const { fences } = extractFences(text || '');
  const out = [];
  const seen = new Set();
  for (const f of fences) {
    const p = fencePath(f.info);
    if (!p || seen.has(p)) continue;
    seen.add(p);
    out.push({ path: p, content: f.code, lang: fileMeta(p).lang });
  }
  return out;
}
async function runAgent(am, userText, attachments) {
  const kind = classifyTask(userText);
  const labels = STAGE_LABELS[kind];
  am.status = { state: 'active', events: [] };
  stEvent(am, labels.run);
  state.streaming = true;
  state.stopRequested = false;
  state.agentStatus = am.id;
  updateSend();
  const node = NODES.get(am.id);
  const liveProse = node ? node.querySelector('.prose') : null;
  const liveStatus = node ? node.querySelector('.th-live .txt') : null;
  let renderQueued = false, acc = '';
  const scheduleRender = () => {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      if (liveProse) { liveProse.innerHTML = mdToHtml(acc, false); }
      if (liveStatus) liveStatus.textContent = stCurrentLabel(am);
      if (nearBottom()) chatEl.scrollTop = chatEl.scrollHeight;
    });
  };
  const ep = aiEndpoint();
  const ctrl = new AbortController();
  state.abort = ctrl;
  let watchdog = null;
  const armWatchdog = () => {
    clearTimeout(watchdog);
    watchdog = setTimeout(() => ctrl.abort(), CFG.STREAM_TIMEOUT_MS);
  };
  let errObj = null, netErr = false, rawErr = '';
  try {
    if (!ep) throw new Error('No AI endpoint configured.');
    const hist = [];
    const msgs = state.messages;
    for (const mm of msgs) {
      if (mm === am) break;
      if (mm.role === 'user') hist.push({ role: 'user', content: (mm.text || '') + (mm.attachments && mm.attachments.length ? '\n[attached: ' + mm.attachments.map(a => a.name).join(', ') + ' — content is in the project context]' : '') });
      else if (mm.role === 'ai' && mm.text && !mm.error) hist.push({ role: 'assistant', content: mm.text });
    }
    const trimmed = hist.slice(-CFG.MAX_HISTORY_MSGS);
    let userContent = userText;
    const images = (attachments || []).filter(a => a.kind === 'image' && a.dataUrl);
    const provName = (activeProviderObj() || {}).name || '';
    if (images.length && VISION_PROVIDERS.test(provName)) {
      userContent = [{ type: 'text', text: userText || 'Describe the attached files.' }];
      images.forEach(a => userContent.push({ type: 'image_url', image_url: { url: a.dataUrl } }));
    }
    const body = {
      model: ep.model || undefined,
      messages: [{ role: 'system', content: buildSystemPrompt(kind) }, ...trimmed, { role: 'user', content: userContent }],
      stream: true
    };
    if (ep.model) body.model = ep.model;
    if (/openai|groq/i.test(provName) && state.deepThink) body.reasoning_effort = THINK_MAP[state.deepThink];
    const headers = { 'Content-Type': 'application/json' };
    if (ep.key) headers['Authorization'] = 'Bearer ' + ep.key;
    armWatchdog();
    const res = await fetch(ep.url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctrl.signal });
    if (!res.ok) {
      let d = '';
      try { d = await res.text(); } catch (e) {}
      rawErr = 'HTTP ' + res.status + ' — ' + (d || '').slice(0, 1200);
      throw Object.assign(new Error('HTTP ' + res.status), { status: res.status });
    }
    stFinishCurrent(am);
    if (res.body && res.body.getReader) {
      stEvent(am, labels.stream);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        armWatchdog();
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith('data:')) continue;
          const data = t.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.text ?? '';
            if (delta) { acc += delta; scheduleRender(); }
          } catch (e) {}
        }
      }
    } else {
      stEvent(am, labels.stream);
      const j = await res.json();
      acc = j.choices?.[0]?.message?.content || '';
      scheduleRender();
    }
  } catch (e) {
    stFinishCurrent(am);
    if (e.name === 'AbortError') {
      if (state.stopRequested) { am.stopped = true; }
      else { netErr = true; rawErr = 'Stream timed out after ' + (CFG.STREAM_TIMEOUT_MS / 1000) + 's of inactivity.'; errObj = friendlyError(0, rawErr, true); }
    } else {

    }
  } finally {
    clearTimeout(watchdog);

    state.streaming = false;
    state.abort = null;
    state.agentStatus = null;
    am.pendingRender = false;
  }
  if (acc) am.text = acc;
  // Real post-processing: extract + apply generated files
  if (acc && !errObj) {
    stEvent(am, labels.end);
    const parsed = parseFilesFromText(acc);
    if (parsed.length) {
      const statuses = {};
      for (const f of parsed) {
        const existed = !!projectFile(f.path);
        putProjectFile(f.path, f.content);
        statuses[f.path] = existed ? 'updated' : 'new';
        if (!am.files) am.files = [];
        if (!am.files.some(x => x.path === f.path)) am.files.push({ path: f.path, status: statuses[f.path], size: byteLen(f.content), lang: fileMeta(f.path).lang });
      }
      viewer.statuses = null;
    }
    stFinishCurrent(am);
  }
  if (errObj) {
    am.status.events.push({ label: 'Failed — ' + errObj.title, t0: am.ts, t1: Date.now(), error: true });
    am.error = { ...errObj, raw: rawErr };
  } else if (am.stopped) {
    am.status.events.push({ label: 'Stopped by user', t0: am.ts, t1: Date.now(), error: false });
  } else {
    am.status.events.push({ label: am.files && am.files.length ? 'Prepared ' + am.files.length + ' file' + (am.files.length > 1 ? 's' : '') : 'Completed', t0: am.ts, t1: Date.now(), error: false });
  }
  am.status.state = 'done';

  rerenderMessage(am);
  persist();
}

  // attachments that carry code become part of the project (source of truth)
  for (const a of atts) {
    if (a.kind === 'text' && a.path) putProjectFile(a.path, a.text);
    if (a.kind === 'zip' && a.files) for (const f of a.files) putProjectFile(f.path, f.text, f.dataUrl, f.size);
    if (a.kind === 'image' && a.path) putProjectFile(a.path, '', a.dataUrl, a.size);
  }
  const um = { id: uid(), role: 'user', ts: Date.now(), text,
    attachments: atts.map(a => ({ name: a.name, size: a.size, kind: a.kind, path: a.path || null })) };
  state.messages.push(um);
  appendMessage(um);
  const am = { id: uid(), role: 'ai', ts: Date.now(), model: currentModelLabel(), text: '', pendingRender: true, files: [] };
  state.messages.push(am);
  appendMessage(am);
  updateSend();
  persist();
  await runAgent(am, text, atts);
}

function renderTray() {
  trayEl.hidden = !state.pending.length;
  trayEl.innerHTML = state.pending.map(a =>
    '<div class="chip"><span class="chip-ic">' + I(a.kind === 'zip' ? 'zip' : a.kind === 'image' ? 'eye' : a.kind === 'text' ? 'code' : 'file') + '</span>' +

    '<button class="chip-x" data-rmatt="' + a.id + '" aria-label="Remove attachment" title="Remove">' + I('x') + '</button></div>').join('');
  updateSend();
}
function readFileText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || '').replace(/^\uFEFF/, ''));
    r.onerror = rej;
    r.readAsText(file);
  });
}
function readFileDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function extractZip(file) {
  if (window.__noJsZip || !window.JSZip) { toast('ZIP support unavailable — JSZip failed to load', 'err'); return null; }
  if (file.size > CFG.MAX_ZIP_MB * 1048576) { toast('ZIP exceeds ' + CFG.MAX_ZIP_MB + ' MB limit', 'err'); return null; }
  try {
    const zip = await JSZip.loadAsync(file);
    const entries = Object.values(zip.files).filter(e => !e.dir);
    if (entries.length > CFG.MAX_FILES) { toast('ZIP contains too many files (max ' + CFG.MAX_FILES + ')', 'err'); return null; }
    const files = [];
    for (const e of entries) {
      const p = safePath(e.name);
      if (!p) continue;
      const ext = extOf(p);
      if (IMG_EXT.has(ext)) {
        try { files.push({ path: p, text: '', dataUrl: await e.async('dataurl'), size: -1 }); } catch (err) {}
      } else if (isTextFile(p)) {
        try { const t = await e.async('string'); files.push({ path: p, text: t.replace(/^\uFEFF/, ''), size: byteLen(t) }); } catch (err) {}
      }
    }
    return files;
  } catch (e) { toast('Could not read this ZIP file', 'err'); return null; }
}
async function handleFiles(list) {
  for (const file of list) {
    if (file.size > CFG.MAX_FILE_MB * 1048576 && !/\.zip$/i.test(file.name)) { toast(file.name + ' exceeds ' + CFG.MAX_FILE_MB + ' MB', 'err'); continue; }
    const att = { id: uid(), name: file.name, size: file.size, kind: 'file' };
    if (/\.zip$/i.test(file.name)) {
      att.kind = 'zip';
      att.files = [];
      renderTray();
      state.pending.push(att); renderTray();
      const files = await extractZip(file);
      if (files) { att.files = files; toast(files.length + ' files extracted from ' + file.name, 'ok'); }
      else state.pending = state.pending.filter(x => x !== att);
    } else if (IMG_EXT.has(extOf(file.name)) || (file.type && file.type.startsWith('image/'))) {
      if (file.size > CFG.MAX_AI_IMAGE_MB * 1048576) { toast(file.name + ' exceeds ' + CFG.MAX_AI_IMAGE_MB + ' MB image limit', 'err'); continue; }
      att.kind = 'image';
      att.path = safePath(file.name);
      att.dataUrl = await readFileDataUrl(file);
      state.pending.push(att);
    } else if (isTextFile(file.name, file.type)) {
      att.kind = 'text';
      att.path = safePath(file.name);
      att.text = await readFileText(file);
      state.pending.push(att);
    } else {
      toast('Unsupported file type: ' + file.name, 'err');
      continue;
    }
    renderTray();
  }
}

/* =====================================================================

===================================================================== */
async function downloadProjectZip() {
  if (!state.project.files.length) { toast('No project files to download yet', 'err'); return; }
  if (window.__noJsZip || !window.JSZip) { toast('ZIP support unavailable — JSZip failed to load', 'err'); return; }
  const zip = new JSZip();
  for (const f of state.project.files) {
    if (f.dataUrl) {
      const b64 = f.dataUrl.split(',')[1];
      if (b64) zip.file(f.path, b64, { base64: true });
    } else zip.file(f.path, f.content || '');
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, (slug(state.project.name) || 'project') + '.zip');
  toast('Project ZIP downloaded', 'ok');
}
function downloadSingleFile(path) {
  const f = projectFile(path);
  if (!f) return;
  if (f.dataUrl) {
    const b64 = f.dataUrl.split(',')[1];
    const mime = f.dataUrl.match(/^data:([^;]+)/)?.[1] || mimeFromName(path);
    if (b64) downloadBlob(new Blob([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], { type: mime }), baseName(path));
  } else downloadText(f.content || '', baseName(path), mimeFromName(path));
}

}
function renderEmptyExtras() {
  $('#qaWrap').innerHTML = QUICK_ACTIONS.map(q => '<button class="qa" data-q="' + esc(q.prompt) + '">' + I('zap','ic-xs') + esc(q.label) + '</button>').join('');
  const p = activeProviderObj();
  $('#setupCta').innerHTML = p && p.apiKey ? '' :
    '<button class="btn btn-dark" id="setupBtn">' + I('cpu','ic-xs') + ' Connect an AI provider</button>';
  const sb = $('#setupBtn');
  if (sb) sb.addEventListener('click', openProvider);
}

/* =====================================================================
   INIT
===================================================================== */
function init() {
  loadPersisted();
  buildOverlays();
  paintStaticIcons();
  wire();
  $('#btnGlobe').classList.toggle('on', state.webSearch);
  $('#btnGlobe').setAttribute('aria-pressed', state.webSearch);
  renderThread();
  renderEmptyExtras();
  updateSend();
  autoResize();
  const mo = new MutationObserver(renderEmptyExtras);
  mo.observe(emptyEl, { attributes: true });
  const origUpdate = updateEmpty;
  updateEmpty = function () { origUpdate(); renderEmptyExtras(); };
  updateEmpty();
}
init();
</script>
</body>
</html>
