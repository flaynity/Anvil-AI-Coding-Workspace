<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<title>Flay AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--pop:#FFFFFF;--ink:#000000;--tx:#111111;--tx2:#4D4D4D;--tx3:#767676;
  --line:#D9D9D9;--hair:#ECECEC;--soft:#F4F4F4;--soft2:#FAFAFA;
  --red:#D80E45;--red-deep:#8A0B30;--ok:#1E7D32;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk','Segoe UI',Tahoma,sans-serif;
  --sh:0 12px 32px rgba(0,0,0,.10);
}
[data-theme="dark"]{
  --bg:#000000;--card:#0A0A0A;--pop:#121212;--tx:#F4F4F4;--tx2:#B8B8B8;--tx3:#8A8A8A;
  --line:#2E2E2E;--hair:#1F1F1F;--soft:#161616;--soft2:#0D0D0D;--ok:#3DDC84;
  --sh:0 12px 32px rgba(0,0,0,.65);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font:500 15px/1.5 var(--sans);color:var(--tx);background:var(--bg);position:fixed;inset:0}
::selection{background:var(--tx);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .fl{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ===== Brain / thinking animations ===== */
@keyframes think{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.18);opacity:1}}
.brain{animation:think 1.4s ease-in-out infinite}

/* ===== Floating thinking pill (ভাস্বমান) ===== */
#thinkFloat{position:fixed;top:calc(env(safe-area-inset-top) + 66px);left:50%;z-index:118;
  display:flex;align-items:center;gap:9px;background:var(--tx);color:var(--bg);
  border:1px solid rgba(128,128,128,.3);border-radius:999px;padding:10px 17px;
  font-size:13.5px;font-weight:700;box-shadow:var(--sh);max-width:88vw;
  opacity:0;pointer-events:none;transform:translate(-50%,-14px) scale(.92);
  transition:opacity .28s,transform .28s cubic-bezier(.2,.8,.2,1)}
#thinkFloat.on{opacity:1;pointer-events:auto;cursor:pointer;transform:translate(-50%,0)}
#thinkFloat .brain{width:17px;height:17px;flex:none;animation-duration:1.1s}
#thinkFloat .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}

/* ===== Floating top bar ===== */
#topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;pointer-events:none;background:linear-gradient(180deg,var(--bg) 30%,rgba(255,255,255,0))}
[data-theme="dark"] #topbar{background:linear-gradient(180deg,var(--bg) 30%,rgba(0,0,0,0))}
.fbtn{pointer-events:auto;width:46px;height:46px;flex:none;border-radius:15px;background:var(--card);color:var(--tx);border:1px solid var(--hair);box-shadow:0 6px 20px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.fbtn:active{transform:scale(.92)}
.fbtn .ic{width:21px;height:21px}
.fbtn.sm{width:38px;height:38px;border-radius:12px;box-shadow:none}
.fbtn.sm .ic{width:18px;height:18px}
.fbtn.dim{color:var(--tx2)}

/* ===== Android mode header ===== */
#androidTopBar{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.ba-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ba-logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--red);flex:none;display:flex;align-items:center;justify-content:center;font:italic 700 14px var(--sans)}
.ba-meta{min-width:0;flex:1}
.ba-meta b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ba-meta span{font-size:11px;color:var(--tx3);font-weight:600}
.ba-acts{display:flex;align-items:center;gap:6px;flex:none}
.bbtn{padding:0 12px;height:34px;font-size:13px;font-weight:700;border-radius:10px;background:var(--ink);color:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:6px;transition:.12s}
.bbtn:active{transform:scale(.95)}
.bbtn .ic{width:15px;height:15px}
#androidMorePop{position:fixed;top:calc(env(safe-area-inset-top) + 60px);right:14px;background:var(--pop);border:1px solid var(--hair);border-radius:16px;padding:6px;box-shadow:var(--sh);z-index:110;transform-origin:top right;transform:scale(.92);opacity:0;transition:.2s cubic-bezier(.2,.8,.2,1);pointer-events:none;min-width:215px}
#androidMorePop.on{transform:none;opacity:1;pointer-events:auto}
#androidMorePop button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;font-size:14px;font-weight:600;text-align:left;border-radius:11px}
#androidMorePop button:hover{background:var(--soft)}
#androidMorePop .ic{width:18px;height:18px;color:var(--tx2)}

#projectBar{flex:none;display:flex;align-items:center;gap:10px;margin:calc(env(safe-area-inset-top) + 64px) 12px 0;padding:9px 10px 9px 14px;border:1px solid var(--hair);border-radius:16px;background:var(--soft2)}
#projectBar>.ic{color:var(--tx2)}
.pb-m{flex:1;min-width:0}
.pb-m b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-m span{font-size:12px;color:var(--tx3);font-weight:500}
.pb-open{flex:none;display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}
.pb-open .ic{width:13px;height:13px}
.pb-open:active{transform:scale(.95)}

#chatScroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#thread{max-width:780px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 82px) 14px 24px}
#thread.am-padding{padding-top:calc(env(safe-area-inset-top) + 76px)}
#emptyState{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 120px}
.es-mark{width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--red);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font:italic 700 30px var(--sans);letter-spacing:-1px;margin-bottom:20px;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.es-mark .ic{width:32px;height:32px;stroke-width:1.6}
.es-mark.am{background:var(--bg);color:var(--tx);font-size:0;border:2px solid var(--tx)}
#emptyState h1{font-size:27px;font-weight:700;letter-spacing:-.8px;margin-bottom:10px}
#emptyState p{max-width:390px;font-size:14.5px;line-height:1.65;color:var(--tx2);font-weight:500;margin-bottom:24px}
.es-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px}
.chip{border:1px solid var(--line);border-radius:22px;padding:9px 15px;font-size:13px;font-weight:700;background:var(--card);transition:.15s}
.chip:hover{border-color:var(--tx)}
.chip:active{transform:scale(.96)}

.msg{display:flex;gap:10px;margin:20px 0}
.msg.user{flex-direction:column;align-items:flex-end;gap:6px}
.u-bubble{background:var(--ink);color:var(--bg);border-radius:18px 18px 5px 18px;padding:11px 15px;max-width:84%;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;cursor:pointer}
.u-bubble.clamp{display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.u-bubble code{background:rgba(128,128,128,.25);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:13px}
.u-atts{display:flex;flex-wrap:wrap;gap:6px;max-width:84%;justify-content:flex-end}
.att-mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:12px;color:var(--tx2);background:var(--card);max-width:220px}
.att-mini .ic{width:14px;height:14px}
.att-mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-mini.ctx-tagged{border-color:var(--tx);color:var(--tx);font-weight:700}
.att-mini.ctx-tagged .ic{color:var(--ok)}

.msg.ai{align-items:flex-start}
.ai-main{flex:1;min-width:0}
.think-row{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:13.5px;font-weight:700;padding:3px 0}
.think-row .brain{width:17px;height:17px}
.caret{display:inline-block;width:8px;height:15px;background:var(--tx);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.seg-t{font-size:15px;line-height:1.65;word-break:break-word;margin:4px 0;font-weight:500}
.seg-t .md-h{display:block;font-weight:700;font-size:16px;margin:10px 0 2px}
.seg-t code{background:var(--soft);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:13px}
.seg-t a{color:var(--tx)}
.seg-t .md-li{color:var(--tx2);display:block}
.s-ring{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--tx);animation:rot 1s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

.codebox{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0;background:var(--card)}
.cb-head{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;background:var(--soft);border-bottom:1px solid var(--hair)}
.cb-lang{flex:1;font:700 11.5px var(--mono);letter-spacing:.5px;color:var(--tx2);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-copy{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
.cb-copy .ic{width:13px;height:13px}
.cb-copy.done{border-color:var(--tx)}
.codebox pre{margin:0;padding:12px 14px;overflow:auto;max-height:420px}
.codebox code{font:12.5px/1.6 var(--mono);white-space:pre;tab-size:2}
.tk-str{color:var(--red-deep)}.tk-cmt{color:var(--tx3);font-style:italic}
[data-theme="dark"] .tk-str{color:#FF6B93}

.fcard{display:flex;align-items:center;gap:12px;width:100%;max-width:400px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;cursor:pointer;transition:border-color .15s}
.fcard:hover{border-color:var(--tx)}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstat{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);font-weight:600;margin-top:2px;overflow:hidden}
.fstat .ic{width:12px;height:12px}
.fstat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Agent activity (Antigravity style) ===== */
.ag{border:1px solid var(--line);border-radius:16px;margin:6px 0 10px;max-width:470px;background:var(--card);overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.ag-h{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;text-align:left}
.ag-h>.ic{width:19px;height:19px;color:var(--tx2)}
.ag-h b{flex:1;font-size:13.5px;font-weight:700}
.ag-st{flex:none;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:7px;padding:3px 8px;background:var(--soft);color:var(--tx2)}
.ag-st.run{background:var(--ink);color:var(--bg)}
.ag-st.err{background:var(--red);color:#fff}
.ag-chv{width:15px;height:15px;color:var(--tx3);transition:transform .18s}
.ag.closed .ag-chv{transform:rotate(-90deg)}
.ag.closed .ag-b{display:none}
.ag-b{border-top:1px solid var(--hair);padding:6px 8px 10px}
.ag-i{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:10px;animation:agIn .25s cubic-bezier(.2,.8,.2,1)}
@keyframes agIn{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.ag-ic{width:17px;height:17px;flex:none;margin-top:1px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.ag-ic .ic{width:17px;height:17px}
.ag-ic.spin .s-ring{width:15px;height:15px}
.ag-i.st-ok .ag-ic{color:var(--ok)}
.ag-i.st-err .ag-ic{color:var(--red)}
.ag-i.st-warn .ag-ic{color:#C77700}
.ag-t{flex:1;min-width:0}
.ag-t b{display:block;font-size:13px;font-weight:700;word-break:break-word}
.ag-t i{display:block;font-style:normal;font:500 11.5px var(--mono);color:var(--tx3);word-break:break-all;margin-top:1px}
.think-line{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;flex:1;min-width:0}
.think-line .brain{width:15px;height:15px;flex:none}
.think-line .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-chg{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 2px}
.chg-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:3px 8px;font:600 11px var(--mono);cursor:pointer;max-width:100%}
.chg-chip em{font-style:normal;font-weight:800}
.chg-chip .cp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.chg-chip.o-add em{color:var(--ok)}.chg-chip.o-mod em{color:#C77700}.chg-chip.o-del em{color:var(--red)}

/* ===== Composer ===== */
#composerWrap{flex:none;position:relative;padding:6px 12px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg)}
#composer{border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 2px 18px rgba(0,0,0,.06);max-width:780px;margin:0 auto;overflow:hidden;position:relative}
#attachRow{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 0}
.att-chip{flex:none;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;padding:6px 8px;max-width:250px;background:var(--card)}
.att-chip.bad{border-color:var(--red)}
.att-th{width:36px;height:36px;border-radius:9px;object-fit:cover}
.att-ic{width:36px;height:36px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.att-ic.ctx{color:var(--ok)}
.att-m{min-width:0}
.att-m b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.att-s{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.att-x{color:var(--tx3);padding:2px}
.att-x .ic{width:14px;height:14px}
#input{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--tx);font:500 15.5px/1.5 var(--sans);padding:14px 16px 4px;max-height:36vh}
#input::placeholder{color:var(--tx3)}
.controls{display:flex;align-items:center;gap:4px;padding:4px 6px 6px;min-width:0}
.cbtn{width:36px;height:36px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.cbtn:hover{background:var(--soft);color:var(--tx)}
.cbtn .ic{width:19px;height:19px}
.pill{flex:1 1 auto;min-width:0;max-width:150px;display:flex;align-items:center;gap:5px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:16px;font-size:12px;font-weight:700;color:var(--tx2)}
.pill .pl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pill .ic{width:14px;height:14px;flex:none}
.pill:hover{border-color:var(--tx);color:var(--tx)}
@media(max-width:430px){.pill{max-width:none;padding:0 8px}.pill .chev{display:none}}
#btnSend{width:40px;height:40px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .2s}
#btnSend:active{transform:scale(.92)}
#btnSend.stream{background:var(--red)}
#btnSend.dim{opacity:.35}
#btnSend .ic{width:19px;height:19px}
#attachPop{position:absolute;bottom:calc(100% + 10px);left:14px;z-index:40;background:var(--pop);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--sh);padding:6px;min-width:215px;transform-origin:bottom left;transform:scale(.95);opacity:0;transition:.15s;pointer-events:none}
#attachPop.on{transform:none;opacity:1;pointer-events:auto}
#attachPop button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:11px;font-size:14px;font-weight:600;text-align:left}
#attachPop button:hover{background:var(--soft)}
#attachPop .ic{width:18px;height:18px;color:var(--tx2)}
#scrollBtn{position:absolute;bottom:calc(100% + 12px);right:16px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);z-index:20}
#scrollBtn .ic{width:18px;height:18px}

/* ===== Overlays / sheets / dialogs ===== */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.ov.on{opacity:1}
.ov.left{justify-content:flex-start;align-items:stretch}
.sheet{background:var(--pop);width:100%;max-width:560px;max-height:84vh;max-height:84dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(26px);transition:transform .22s cubic-bezier(.2,.7,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.ov.on .sheet{transform:none}
@media(min-width:760px){.ov:not(.left){align-items:center}.ov:not(.left) .sheet{border-radius:20px;max-height:86vh}}
.sh-grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0;flex:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--hair);flex:none}
.sh-head h3{flex:1;font-size:16px;font-weight:700}
.sh-body{overflow-y:auto;padding:14px 18px 20px}
.dlg-ov{z-index:120;align-items:center}
.dlg{background:var(--pop);border-radius:18px;max-width:390px;width:calc(100% - 32px);padding:20px;box-shadow:var(--sh);transform:translateY(10px);transition:transform .2s;max-height:86vh;overflow:auto}
.ov.on .dlg{transform:none}
.dlg h3{font-size:17px;font-weight:700;margin-bottom:8px}
.dlg-b{font-size:13.5px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;margin-bottom:18px}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 18px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn .ic{width:16px;height:16px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--tx)}
.btn.danger{background:var(--red)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;transform:none;cursor:not-allowed}

/* ===== Menu drawer ===== */
.drawer{width:min(88vw,380px);height:100%;background:var(--soft);display:flex;flex-direction:column;transform:translateX(-40px);opacity:.6;transition:transform .24s cubic-bezier(.2,.7,.3,1),opacity .2s;padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:env(safe-area-inset-bottom)}
.ov.on .drawer{transform:none;opacity:1}
.dw-head{display:flex;align-items:center;gap:13px;padding:14px 16px 12px}
.dw-logo{width:54px;height:54px;flex:none;border-radius:17px;background:var(--ink);color:var(--red);display:flex;align-items:center;justify-content:center;font:italic 700 30px var(--sans);letter-spacing:-1px;box-shadow:0 8px 22px rgba(0,0,0,.16)}
.dw-title{flex:1;min-width:0}
.dw-title b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.dw-title b em{color:var(--red);font-style:normal}
.dw-title>span{display:block;font-size:12.5px;font-weight:600;color:var(--tx3);margin-top:3px}
.dw-body{flex:1;overflow-y:auto;padding:6px 16px 20px}
.dw-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
.dw-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;cursor:pointer;transition:all .2s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 12px rgba(0,0,0,.03)}
.dw-card:hover{transform:translateY(-4px);border-color:var(--tx);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.dw-card:active{transform:scale(.96)}
.dw-card .tile{width:56px;height:56px;border-radius:18px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -3px 8px rgba(0,0,0,.15)}
.dw-card .tile .ic{width:27px;height:27px}
.t-blue{background:linear-gradient(135deg,#2B85FF,#0056D2)}
.t-purple{background:linear-gradient(135deg,#8A4BFF,#5618D4)}
.t-teal{background:linear-gradient(135deg,#0BC495,#088E6A)}
.t-green{background:linear-gradient(135deg,#3DDC84,#1B8C30)}
.dw-card b{font-size:14px;font-weight:700;line-height:1.35;letter-spacing:-.2px;display:block}
.dw-card small{display:block;font-size:11px;color:var(--tx3);font-weight:600;margin-top:2px}
.dw-sec{font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin:18px 0 8px}
.hist-list{padding:0 2px}
.h-row{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 10px;border-radius:13px}
.h-row:hover{background:var(--soft)}
.h-m{flex:1;min-width:0;cursor:pointer}
.h-m b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-m span{font-size:11.5px;color:var(--tx3);font-weight:500}
.h-del{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.h-del .ic{width:16px;height:16px}
.h-empty{font-size:13px;font-weight:600;color:var(--tx3);padding:14px 10px;text-align:center;white-space:pre-line}
.dw-foot{flex:none;display:flex;align-items:center;gap:12px;margin:0 14px;padding:14px 2px 6px;border-top:1px solid var(--hair)}
.theme-btn{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:700;flex:none}
.theme-btn .ic{width:16px;height:16px}
.dw-foot p{font-size:11px;font-weight:500;color:var(--tx3);line-height:1.55;flex:1}

/* ===== Full-screen layers ===== */
.layer{position:fixed;inset:0;background:var(--bg);z-index:85;display:flex;flex-direction:column;opacity:0;transform:translateY(15px) scale(.985);transition:.26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.layer.on{opacity:1;transform:none}
.lay-head{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;border-bottom:1px solid var(--hair);background:var(--card)}
.lay-title{flex:1;min-width:0;text-align:center}
.lay-title h2{font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay-title span{font-size:12px;color:var(--tx3);font-weight:600}
.lay-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 18px 40px;display:flex;flex-direction:column;gap:14px;max-width:660px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.lay-note{font-size:14px;color:var(--tx2);font-weight:500;line-height:1.6;text-align:center}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:2px}
.step-dots i{width:22px;height:4px;border-radius:4px;background:var(--line)}
.step-dots i.on{background:var(--tx)}

/* Select app code — 1:1 cards, 2-column */
.tech-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.tech-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;aspect-ratio:1/1;padding:14px 10px;border:2px solid var(--line);border-radius:24px;background:var(--card);transition:all .2s cubic-bezier(.2,.8,.2,1);cursor:pointer;position:relative}
.tech-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.tech-card.active{border-color:var(--tx);box-shadow:0 12px 32px rgba(0,0,0,.14);transform:translateY(-4px)}
.tech-card svg.tlogo{width:56px;height:56px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.tech-card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.tech-card p{font-size:11.5px;font-weight:500;color:var(--tx2);line-height:1.45}
.tc-chk{position:absolute;top:13px;right:13px;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);color:transparent;transition:.2s;background:var(--card)}
.tc-chk .ic{width:14px;height:14px;stroke-width:3}
.tech-card.active .tc-chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fbtn-large{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:66px;border-radius:22px;font-size:17px;font-weight:700;color:var(--bg);background:var(--ink);transition:transform .12s,opacity .2s;box-shadow:0 10px 26px rgba(0,0,0,.18);margin-top:auto;flex:none}
.fbtn-large:active{transform:scale(.97)}
.fbtn-large:disabled{opacity:.35;transform:none;cursor:not-allowed;box-shadow:none}
.fbtn-large .ic{width:19px;height:19px}

/* Forms */
.field{margin:4px 0;width:100%}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:500 15px var(--sans);background:var(--card);color:var(--tx);transition:border-color .2s,box-shadow .2s}
.inp.mono{font-family:var(--mono);font-size:13.5px}
.inp:focus{outline:none;border-color:var(--tx);box-shadow:0 0 0 3px rgba(128,128,128,.14)}
.inp.bad{border-color:var(--red)}
textarea.inp{resize:vertical;min-height:70px}
.err-t{color:var(--red);font-size:12px;font-weight:600;margin-top:5px;display:flex;align-items:center;gap:5px}
.err-t .ic{width:13px;height:13px}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.key-wrap{position:relative}
.key-wrap .inp{padding-right:46px}
.key-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.key-eye .ic{width:17px;height:17px}
.hint{font-size:12px;color:var(--tx3);font-weight:500;margin-top:5px;line-height:1.5}
.fchk{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;font-weight:600}
.fchk input{width:18px;height:18px;accent-color:var(--tx)}
.form-btns{display:flex;gap:8px;margin-top:16px}
.form-btns .btn{flex:1}
.p-note{display:flex;gap:10px;border:1px solid var(--hair);border-radius:12px;padding:12px;font-size:12.5px;color:var(--tx2);font-weight:500;line-height:1.6;margin:6px 0}
.p-note .ic{width:16px;height:16px;flex:none;margin-top:2px}

/* Provider cards */
.prov-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:2px 0;background:var(--card);animation:agIn .3s cubic-bezier(.2,.8,.2,1)}
.pc-h{display:flex;align-items:center;gap:10px}
.pc-h b{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-model{font:700 11.5px var(--mono);color:var(--tx2);background:var(--soft);border-radius:7px;padding:2px 8px;white-space:nowrap}
.pc-u{font-size:12px;color:var(--tx3);margin-top:5px;font-family:var(--mono);word-break:break-word}
.pc-badge{flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 7px}
.pc-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty-note{text-align:center;color:var(--tx3);font-weight:600;font-size:13.5px;padding:26px 10px;border:1px dashed var(--line);border-radius:16px;white-space:pre-line}
.model-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--hair);border-radius:12px;padding:12px 13px;margin:6px 0}
.model-row:hover{border-color:var(--tx)}
.model-row.on{border-color:var(--tx);background:var(--soft2)}
.model-row .ic{width:16px;height:16px;margin-left:auto;color:var(--tx)}
.mo-name{flex:1;min-width:0}
.mo-name b{display:block;font-size:14px;font-weight:700}

/* Test connection modal */
.tc-big{width:74px;height:74px;margin:6px auto 14px;display:flex;align-items:center;justify-content:center}
.tc-big .s-ring{width:52px;height:52px;border-width:4px;border-top-color:var(--tx)}
.tc-big .okc,.tc-big .errc{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.tc-big .okc{background:var(--ok)}
.tc-big .errc{background:var(--red)}
.tc-big .ic{width:36px;height:36px;stroke-width:2.4}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.tc-msg{text-align:center;font-size:15px;font-weight:700}
.tc-sub{text-align:center;font-size:12.5px;color:var(--tx2);font-weight:500;margin-top:6px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.tc-stage{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--tx3)}
.tc-stage .ag-ic{width:17px;height:17px;color:var(--tx3)}
.tc-stage .s-ring{width:13px;height:13px;border-width:2px}
.tc-stage.st-ok{color:var(--tx)}.tc-stage.st-ok .ag-ic{color:var(--ok)}
.tc-stage.st-err{color:var(--red)}.tc-stage.st-err .ag-ic{color:var(--red)}
.tc-stage.st-warn{color:#C77700}.tc-stage.st-warn .ag-ic{color:#C77700}

/* ===== App Code Root (VS Code style) ===== */
#rootStats{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--hair);background:var(--soft2);font:600 11.5px var(--mono);color:var(--tx3);white-space:nowrap;overflow-x:auto}
#rootStats .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.fsWrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.fsTree{display:block;min-width:100%;width:max-content;padding:10px 12px 30px}
.fs-row{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 calc(10px + var(--d,0)*18px);font-size:14.5px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:12px;transition:background .12s;white-space:nowrap;min-width:calc(100% - 24px);width:max-content}
.fs-row:hover{background:var(--soft)}
.fs-row:active{transform:scale(.99)}
.fs-row.sel{background:var(--soft);background:color-mix(in srgb,var(--ok) 12%,var(--card));color:var(--ok)}
.fs-chev{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.fs-chev .ic{width:14px;height:14px;transition:transform .18s}
.fs-row.open>.fs-chev .ic{transform:rotate(90deg)}
.fs-chev.ghost{visibility:hidden}
.fdir{color:#E8B339;flex:none;display:flex}
.fdir .ic{width:20px;height:20px}
.fx{border-radius:7px;font:700 9px var(--mono);display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.3px}
.fx.g{background:var(--soft);color:var(--tx3)}
.fx.g .ic{width:13px;height:13px}
.fs-name{flex:0 1 auto;min-width:0;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.fs-chk{margin-left:14px;width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);color:transparent;display:flex;align-items:center;justify-content:center;transition:.2s;background:var(--card);opacity:0}
.fs-chk .ic{width:12px;height:12px;stroke-width:3}
.fs-row.sel .fs-chk{opacity:1;background:var(--ok);border-color:var(--ok);color:#fff}
.fs-empty{text-align:center;color:var(--tx3);font-weight:600;font-size:13.5px;padding:44px 16px;white-space:pre-line}
.fs-empty .btn{margin-top:16px}

/* ===== Preview viewer ===== */
.viewer{position:fixed;inset:0;background:var(--bg);z-index:95;display:flex;flex-direction:column;opacity:0;transform:translateY(10px);transition:.22s}
.viewer.on{opacity:1;transform:none}
.v-top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--hair)}
.v-title{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.v-title b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-badge{flex:none;font:700 10px var(--mono);background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 7px}
.v-tabs{flex:none;display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--hair)}
.v-tabs button{padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px}
.v-tabs button.on{color:var(--tx);border-color:var(--tx)}
.v-body{flex:1;min-height:0;display:flex}
.v-code{flex:1;overflow:auto;padding:10px 0 30px}
.cl{display:flex;padding-right:16px}
.cl:hover{background:var(--soft2)}
.ln{flex:none;width:3.6ch;color:var(--tx3);text-align:right;padding-right:13px;user-select:none;font:12.5px/1.65 var(--mono)}
.lc{font:12.5px/1.65 var(--mono);white-space:pre;tab-size:2}
.v-preview{flex:1;overflow:auto;display:flex;background:var(--soft2)}
.pv-frame{width:100%;height:100%;border:0;background:#fff}
.pv-img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;padding:14px}
.pv-msg{margin:auto;text-align:center;color:var(--tx3);font-size:13.5px;font-weight:600;padding:24px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 15px;font-size:13.5px;font-weight:600;max-width:92vw;opacity:0;transform:translateY(8px);transition:.22s;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:none}
.toast .ic{width:16px;height:16px;flex:none}
.toast.err .ic{color:#FF5C82}
</style>

<script>
'use strict';
/* ================= Flay AI v3.1 — fixed build ================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const ic=(n,cls)=>`<svg class="ic${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const escBr=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtSize=n=>{n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB';};
const fmtRel=ts=>{const d=Date.now()-ts;if(d<60e3)return'Just now';if(d<3600e3)return Math.floor(d/60e3)+'m ago';if(d<86400e3)return Math.floor(d/86400e3)+'h ago';return new Date(ts).toLocaleDateString();};
const getExt=p=>{const m=/\.([a-z0-9]+)$/i.exec(String(p||'').split('/').pop()||'');return m?m[1].toLowerCase():'';};
const baseName=p=>String(p||'file').split('/').pop()||'file';
const enc8=new TextEncoder(),dec8=new TextDecoder('utf-8');
const T='```';
const TEXT_EXTS=new Set(['html','htm','css','js','mjs','ts','jsx','tsx','json','xml','py','java','kt','kts','gradle','properties','c','h','cpp','hpp','php','sql','md','txt','svg','sh','yml','yaml','ini','cfg']);
const IMG_EXTS=new Set(['png','jpg','jpeg','webp','gif','svg','bmp','ico']);
const hostOf=u=>{try{return new URL(u).host;}catch{return u||'';}};

/* ---------- persistent state ---------- */
const LS='flay3.';
const load=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch{return d;}};
const save=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v));}catch{}};
const S={chatId:null,chats:load('chats',[]),curMsgs:[],
  providers:load('providers',[]),selProviderId:load('sel',null),reason:load('reason','Balanced'),
  streaming:false,abort:null,attachments:[],composerCtx:[],
  android:load('android',null),agentMode:false,
  fsOpen:new Set(load('fsOpen',[])),fsSel:new Set(),nearBottom:true};
const saveAndroid=()=>{save('android',S.android);save('fsOpen',[...S.fsOpen]);};
const getProvider=()=>S.providers.find(p=>p.id===S.selProviderId)||null;

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme=t;save('theme',t);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#000000':'#FFFFFF';
  const lbl=$('#themeLbl');if(lbl)lbl.textContent=t==='dark'?'Light':'Dark';
  const u1=$('#btnTheme use');if(u1)u1.setAttribute('href',t==='dark'?'#i-sun':'#i-moon');
  const u2=$('#btnAndroidPopTheme use');if(u2)u2.setAttribute('href',t==='dark'?'#i-sun':'#i-moon');}
applyTheme(load('theme','light'));
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}

/* ---------- toast / dialog / sheet / layer ---------- */
function toast(msg,kind='info'){const t=el('div','toast '+kind,ic(kind==='err'?'err':kind==='ok'?'ok':'info')+`<span>${esc(msg)}</span>`);
  $('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),240);},3000);}
function confirmDialog(o){return new Promise(res=>{const ov=el('div','ov dlg-ov'),d=el('div','dlg');
  d.innerHTML=`<h3>${esc(o.title)}</h3><div class="dlg-b">${escBr(o.body)}</div>
  <div class="dlg-btns"><button class="btn ghost" data-r="0">${esc(o.cancelLabel||'Cancel')}</button>
  <button class="btn ${o.danger?'danger':''}" data-r="1">${esc(o.okLabel||'Confirm')}</button></div>`;
  ov.appendChild(d);document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('on'));
  const done=v=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),200);res(v);};
  d.querySelector('[data-r="0"]').onclick=()=>done(false);
  d.querySelector('[data-r="1"]').onclick=()=>done(true);
  ov.onclick=e=>{if(e.target===ov)done(false);};});}
function openSheet(title,build){const ov=el('div','ov'),sh=el('div','sheet');
  sh.innerHTML=`<div class="sh-grab"></div><div class="sh-head"><h3>${esc(title)}</h3><button class="fbtn sm" aria-label="Close">${ic('close')}</button></div><div class="sh-body"></div>`;
  const body=sh.querySelector('.sh-body');
  build(body,sh);
  ov.appendChild(sh);document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('on'));
  const close=()=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),220);};
  sh.querySelector('.sh-head .fbtn').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};
  return{close,body,sh};}
function openLayer(title,sub){const L=el('div','layer');
  L.innerHTML=`<div class="lay-head"><button class="fbtn sm lay-back" aria-label="Back">${ic('back')}</button>
  <div class="lay-title"><h2>${esc(title)}</h2>${sub?`<span>${esc(sub)}</span>`:''}</div><span style="width:38px;flex:none"></span></div><div class="lay-body"></div>`;
  document.body.appendChild(L);requestAnimationFrame(()=>L.classList.add('on'));
  const close=()=>{L.classList.remove('on');setTimeout(()=>L.remove(),260);};
  L.querySelector('.lay-back').onclick=close;
  return{root:L,body:L.querySelector('.lay-body'),head:L.querySelector('.lay-head'),close};}

/* ---------- floating thinking pill ---------- */
const thinkFloat={on:false,
  show(t){const f=$('#thinkFloat');f.querySelector('.tt').textContent=t||'Thinking…';f.classList.add('on');this.on=true;},
  update(t){const f=$('#thinkFloat');if(!this.on){f.classList.add('on');this.on=true;}
    f.querySelector('.tt').textContent=String(t||'Thinking…').slice(0,70);},
  hide(){const f=$('#thinkFloat');f.classList.remove('on');this.on=false;}};
 $('#thinkFloat').onclick=()=>scrollBottom(true);

/* ---------- file-type icon (pure HTML — never broken) ---------- */
const EXT_META={html:['#E44D26','#fff','<>'],htm:['#E44D26','#fff','<>'],css:['#1572B6','#fff','#'],
 js:['#F7DF1E','#111','JS'],mjs:['#F7DF1E','#111','JS'],ts:['#3178C6','#fff','TS'],tsx:['#3178C6','#fff','TSX'],
 jsx:['#20232A','#61DAFB','JX'],json:['#8BC34A','#fff','{}'],xml:['#E44D26','#fff','XML'],
 py:['#3776AB','#FFD43B','PY'],java:['#E76F00','#fff','J'],kt:['#7F52FF','#fff','K'],kts:['#7F52FF','#fff','K'],
 gradle:['#02303A','#fff','G'],properties:['#8A8A8A','#fff','CF'],
 c:['#5C6BC0','#fff','C'],h:['#5C6BC0','#fff','H'],cpp:['#03599C','#fff','C+'],hpp:['#03599C','#fff','H+'],
 php:['#777BB4','#fff','PHP'],sql:['#DD6B00','#fff','SQL'],md:['#111','#fff','MD'],txt:['#8A8A8A','#fff','TXT'],
 svg:['#FFB13B','#111','SVG'],yml:['#CB171E','#fff','YML'],yaml:['#CB171E','#fff','YML'],sh:['#4EAA25','#fff','SH']};
function extIcon(path,size=24){const e=getExt(path);const m=EXT_META[e];
  if(!m)return`<span class="fx g" style="width:${size}px;height:${size}px">${ic('file')}</span>`;
  return`<span class="fx" style="width:${size}px;height:${size}px;background:${m[0]};color:${m[1]}">${m[2]}</span>`;}

/* ================= AI CORE (real provider calls — OpenAI-compatible) ================= */
const maskKey=(t,p)=>p?String(t).split(p).join('***'):t;
const apiBase=b=>String(b||'').trim().replace(/\/+$/,'');
async function chatStream(p,messages,signal,onDelta){
  const body={model:p.model,messages,stream:p.stream!==false,temperature:p._temp??0.7};
  const r=await fetch(apiBase(p.base)+'/chat/completions',{method:'POST',signal,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+p.key},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error(maskKey(`HTTP ${r.status} ${r.statusText||''} ${t.slice(0,400)}`,p.key));}
  if(p.stream===false){const j=await r.json();const c=j.choices?.[0]?.message?.content||'';onDelta(c);return;}
  const rd=r.body.getReader();let buf='';
  while(true){const{done,value}=await rd.read();if(done)break;buf+=dec8.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;const data=line.slice(5).trim();
      if(data==='[DONE]')return;
      try{const j=JSON.parse(data);const d=j.choices?.[0]?.delta?.content;if(d)onDelta(d);}catch{}}}}
async function testProvider(p,onStep){
  const base=apiBase(p.base),h={'Authorization':'Bearer '+p.key};
  let err1='';
  try{onStep(0,'run');
    const r=await fetch(base+'/models',{headers:h});
    if(r.ok){onStep(0,'ok');onStep(1,'ok');let warn='';
      try{const j=await r.json();const list=j.data||j.models||[];
        if(p.model&&list.length&&!list.some(m=>String(m.id||m.name||'').toLowerCase().includes(p.model.toLowerCase())))
          warn=`Note: "${p.model}" was not found in the provider's model list.`;}
      catch{}
      onStep(2,warn?'warn':'ok',warn);
      return{ok:true,warn};}
    err1=`HTTP ${r.status} ${r.statusText||''}`;
    if(r.status===401||r.status===403)err1='API key rejected ('+r.status+'). Check your API Key.';
  }catch(e){err1=e.message||'Network error';}
  try{onStep(0,'ok');onStep(1,'run');onStep(2,'run');
    const r2=await fetch(base+'/chat/completions',{method:'POST',headers:{...h,'Content-Type':'application/json'},
      body:JSON.stringify({model:p.model,messages:[{role:'user',content:'ping'}],max_tokens:1,stream:false})});
    if(r2.ok){onStep(1,'ok');onStep(2,'ok');return{ok:true};}
    const t=await r2.text().catch(()=> '');
    onStep(1,'err');onStep(2,'err');
    return{ok:false,err:maskKey(`HTTP ${r2.status}: ${t.slice(0,300)||r2.statusText}`,p.key)};}
  catch(e){onStep(1,'err');onStep(2,'err');
    return{ok:false,err:`${err1} — ${e.message||'Network error'}. Check API URL, API Key, Model, server/proxy status and network connection.`};}}

/* ================= CHAT UI ================= */
const thread=$('#thread'),chatScroll=$('#chatScroll'),inp=$('#input'),btnSend=$('#btnSend');
const REASON={Balanced:{temp:0.7,nudge:''},Precise:{temp:0.3,nudge:' Be precise and deterministic.'},Deep:{temp:0.2,nudge:' Think through the problem carefully step by step before answering.'}};
function miniMD(s){s=esc(s);
  return s.replace(/^#{1,3} (.*)$/gm,'<span class="md-h">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^\s*[-*] (.*)$/gm,'<span class="md-li">• $1</span>')
    .replace(/\n/g,'<br>');}
function parseSegs(raw){const segs=[];let i=0;const re=/```([\w+#.-]*)[^\n]*\n([\s\S]*?)(```|$)/g;let m;
  while(m=re.exec(raw)){
    if(m.index>i)segs.push({t:'txt',v:raw.slice(i,m.index)});
    const head=m[0].slice(0,m[0].indexOf('\n'));
    const fm=/file\s*=\s*"?([^"\s]+)"?/.exec(head);
    segs.push({t:'code',lang:m[1]||'',file:fm?fm[1]:null,body:m[2],closed:m[3]==='```'});
    i=re.lastIndex;}
  if(i<raw.length)segs.push({t:'txt',v:raw.slice(i)});
  return segs;}
function codeBox(lang,body,opts={}){const box=el('div','codebox');
  box.innerHTML=`<div class="cb-head"><span class="cb-lang">${esc(opts.file||lang||'code')}</span>
   <button class="cb-copy">${ic('copy')}<span>Copy</span></button></div><pre><code></code></pre>`;
  box.querySelector('code').textContent=body;
  box.querySelector('.cb-copy').onclick=ev=>{ev.stopPropagation();copyText(body,ev.currentTarget);};
  return box;}
const chatFiles=new Map();
function fileCard(path,content){chatFiles.set(path,content);
  const c=el('button','fcard');
  c.innerHTML=`${extIcon(path,38)}<span class="fmeta"><b>${esc(baseName(path))}</b>
  <span class="fstat">${ic('check')}<span>${esc(path)}</span></span></span>${ic('chev-r')}`;
  c.onclick=()=>{if(S.android&&path in S.android.files)openPreview(path);else openCodeSheet(path,content);};
  return c;}
function openCodeSheet(path,content){openSheet(baseName(path),(body,sh)=>{
  body.appendChild(el('div','p-note',ic('info')+`<span>Chat-generated file. Copy or download it, or ask the Coding Agent to place it in your Android project.</span>`));
  body.appendChild(codeBox(getExt(path),content,{file:path}));
  const acts=el('div','form-btns');
  const cp=el('button','btn ghost',ic('copy')+'<span>Copy</span>');cp.onclick=e=>copyText(content,e.currentTarget);
  const dl=el('button','btn',ic('download')+'<span>Download</span>');

    chg(o,p){const k=o+p;if(changes.has(k))return;changes.add(k);chgCount++;

function projTree(){const a=S.android;const root={d:{},f:{}};
  const ensure=p=>{let n=root;for(const s of String(p).split('/')){if(!s)continue;if(!n.d[s])n.d[s]={d:{},f:{}};n=n.d[s];}return n;};
  for(const p of a.folders||[])ensure(String(p).replace(/\/+$/,''));
  for(const p of Object.keys(a.files)){const i=p.lastIndexOf('/');
    ensure(i<0?'':p.slice(0,i)).f[p.slice(i+1)]=p;}
  return root;}
function treeText(){const lines=[];let count=0;
  (function walk(node,prefix){const dirs=Object.keys(node.d).sort(),files=Object.keys(node.f).sort();
    const all=[...dirs.map(n=>['d',n]),...files.map(n=>['f',n])];
    all.forEach(([k,n],idx)=>{const last=idx===all.length-1;
      lines.push(prefix+(last?'└── ':'├── ')+n);count++;
      if(k==='d')walk(node.d[n],prefix+(last?'    ':'│   '));});})(projTree(),'');
  return lines.slice(0,400).join('\n')+(count>400?`\n… (${count} entries total)`:'');}
function fileCount(){return S.android?Object.keys(S.android.files).length:0;}
function addParentFolders(path){const parts=String(path).split('/');parts.pop();let cur='';
  for(const s of parts){cur=cur?cur+'/'+s:s;
    if(cur&&!S.android.folders.includes(cur))S.android.folders.push(cur);}}
function agentSys(treeStr,focus){const a=S.android;

PROJECT: ${a.name} (${a.type})${a.pkg?' · package '+a.pkg:''}${a.ver?' · v'+a.ver:''}${a.desc?' · '+a.desc:''}

 ${treeStr}

OPERATION SYNTAX — the ONLY ways you modify files (the system executes them for real):
1. Read an existing file before editing it — output on its own line: [[READ:path/to/file]]

2. Create a new file or fully rewrite an existing file:

<complete final file content>

3. Delete a file: [[DELETE:path]]

STRICT RULES:
- Change ONLY the files required by the request. NEVER regenerate unrelated files. Read a file first, then apply a minimal targeted change.
- Preserve existing code style, packages and structure.

- Finish with a short plain-text summary of what changed. Never wrap the summary in code fences.
- If something is impossible or info is missing, say so plainly.`;
  if(focus&&focus.length)sys+=`\n\nUSER FOCUS FILES (prioritize these):\n${focus.map(p=>'- '+p).join('\n')}`;
  return sys;}
async function runAgent(text){
  const p=getProvider();
  if(!p){toast('Set up an AI provider first','err');openSetup();return;}
  if(!S.android){toast('No Android project','err');return;}
  const focus=S.composerCtx.filter(x=>x in S.android.files);
  addUserMsg(text,focus.map(f=>({name:f,ctx:true})));
  S.curMsgs.push({r:'u',t:text,att:focus.map(f=>({name:f,ctx:true}))});
  S.attachments=[];S.composerCtx=[];renderAttachRow();
  const stub=addAIStub(),main=stub.querySelector('.ai-main');main.innerHTML='';
  const act=makeAct(main);
  const _think=act.think.bind(act);
  act.think=t=>{_think(t);thinkFloat.update(t);};
  S.streaming=true;S.abort=new AbortController();setSendState();
  thinkFloat.show('Analyzing the project…');
  let totalChanges=0;
  const agStore={items:[],chg:[],status:'Done',note:''};
  const capture=()=>{agStore.items=[];agStore.chg=[];
    main.querySelectorAll('.ag-i').forEach(e=>{
      if(e.classList.contains('st-spin'))return;
      const L=e.querySelector('b')?.textContent||'';
      if(L==='Implementation complete'||L==='Run failed')return;
      const cls=[...e.classList].find(c=>c.startsWith('st-'));

      agStore.items.push({k:uid(),sym,l:L,d:e.querySelector('i')?.textContent||'',st:cls?cls.slice(3):'ok'});});
    main.querySelectorAll('.chg-chip').forEach(c=>agStore.chg.push([c.querySelector('em').textContent,c.querySelector('.cp').textContent]));
    agStore.note=totalChanges?totalChanges+' file change(s)':'No file changes needed';};
  try{
    act.think('Analyzing the project structure');
    act.op('t0','search','Analyzing project structure',`${fileCount()} files · ${S.android.folders.length} folders`,'ok');
    const P={...p,_temp:0.2};
    const msgs=[{role:'system',content:agentSys(treeText(),focus)}];
    let userPayload=text;
    if(focus.length){userPayload+=`\n\nFOCUS FILE CONTENTS:\n${focus.map(f=>`--- ${f} ---\n${S.android.files[f].c}`).join('\n\n')}`;
      for(const f of focus)act.op('r:'+f,'doc','Reading '+f,'user-attached focus file','ok');}
    msgs.push({role:'user',content:userPayload});
    for(let round=0;round<4;round++){
      let raw='';const seen=new Set();const pendingReads=new Map();let raf=0;
      const applyFeed=()=>{let m;
        const fre=/```[\w+#.-]*[^\n]*?file\s*=\s*"?([^"\s]+)"?[^\n]*\n([\s\S]*?)\n?```/g;
        while(m=fre.exec(raw)){const path=m[1].trim();if(seen.has('w'+path))continue;seen.add('w'+path);
          const exists=!!S.android.files[path];
          S.android.files[path]={c:m[2],ts:Date.now()};addParentFolders(path);saveAndroid();
          act.op('w'+path,exists?'new':'plus',(exists?'Updated: ':'Created: ')+path,'','ok');
          act.chg(exists?'M':'+',path);totalChanges++;updateRootStats();
          if($('#fsTree'))renderTree();}
        const dd=/\[\[DELETE:([^\]\n]+)\]\]/g;
        while(m=dd.exec(raw)){const path=m[1].trim();if(seen.has('x'+path))continue;seen.add('x'+path);
          if(S.android.files[path]){delete S.android.files[path];saveAndroid();
            act.op('x'+path,'trash','Deleted: '+path,'','ok');act.chg('−',path);totalChanges++;updateRootStats();
            if($('#fsTree'))renderTree();}
          else act.op('x'+path,'warn','Delete failed',path+' not found','warn');}
        const mv=/\[\[MOVE:([^\]\n>]+)->([^\]\n]+)\]\]/g;
        while(m=mv.exec(raw)){const o=m[1].trim(),n=m[2].trim();if(seen.has('m'+o+n))continue;seen.add('m'+o+n);
          if(S.android.files[o]){S.android.files[n]={c:S.android.files[o].c,ts:Date.now()};delete S.android.files[o];
            addParentFolders(n);saveAndroid();
            act.op('m'+o+n,'layers','Moved: '+o+' → '+n,'','ok');act.chg('M',n);totalChanges++;updateRootStats();
            if($('#fsTree'))renderTree();}

        const rr=/\[\[READ:([^\]\n]+)\]\]/g;

            pendingReads.set(path,act.op('rq'+path,'doc','Reading: '+path,'requested by agent','spin'));}}
        const lines=raw.split('\n').map(l=>l.trim())
          .filter(l=>l&&!l.startsWith('```')&&!/^\[\[/.test(l)&&!/file\s*=/.test(l));
        if(lines.length)act.think(lines[lines.length-1]);
        scrollBottom();};
      const feed=()=>{if(!raf){raf=1;requestAnimationFrame(()=>{raf=0;applyFeed();});}};
      await chatStream(P,msgs,S.abort.signal,d=>{raw+=d;feed();});
      applyFeed();await new Promise(r=>setTimeout(r,50));applyFeed();
      if(pendingReads.size&&round<3){
        let payload='SYSTEM DATA — real contents of the files you requested to read (not a user request):\n';
        for(const[path,elRq]of pendingReads){const f=S.android.files[path];
          if(f!=null){payload+=`\n--- FILE: ${path} ---\n${f.c}\n--- end of ${path} ---\n`;resolveRead(elRq,'ok','read ok');}
          else{payload+=`\n--- FILE: ${path} --- (NOT FOUND in project)\n`;resolveRead(elRq,'warn','not found');}}
        msgs.push({role:'assistant',content:raw});
        msgs.push({role:'user',content:payload+`\nContinue using these real contents. Fulfill the original request: "${text}". Output the required file operations now.`});
        continue;}
      const summary=raw.replace(/```[\w+#.-]*[^\n]*?file\s*=\s*"?[^"\s]+"?[^\n]*\n[\s\S]*?\n?```/g,'')
        .replace(/\[\[\w+:[^\]\n]*\]\]/g,'').trim();
      if(summary)main.appendChild(el('div','seg-t',miniMD(summary)));
      act.finish('Done',totalChanges?totalChanges+' file change(s)':'No file changes were needed');
      capture();
      S.curMsgs.push({r:'a',t:summary||'',ag:{status:'Done',items:agStore.items,chg:agStore.chg,note:agStore.note}});
      break;}
    if(totalChanges){saveAndroid();updateProjectBar();toast('Agent finished · '+totalChanges+' change(s)','ok');}
    persistChat();
  }catch(e){
    if(e.name==='AbortError'){act.finish('Stopped','run stopped by user');agStore.status='Stopped';agStore.note='Stopped by user';}
    else{act.fail(String(e.message||e).slice(0,220));agStore.status='Failed';agStore.note=String(e.message||e).slice(0,120);}
    capture();S.curMsgs.push({r:'a',t:'',ag:{status:agStore.status,items:agStore.items,chg:agStore.chg,note:agStore.note}});
    persistChat();
  }finally{S.streaming=false;S.abort=null;setSendState();thinkFloat.hide();scrollBottom();}}

function openTestModal(p,onDone){
  const ov=el('div','ov dlg-ov'),d=el('div','dlg');
  d.innerHTML=`<h3 style="text-align:center">Test Connection</h3>
   <div class="tc-big" id="tcBig"><span class="s-ring"></span></div>
   <div class="tc-msg" id="tcMsg">Connecting to AI…</div>
   <div class="tc-sub" id="tcSub">Provider: ${esc(p.name)} · ${esc(hostOf(p.base))}</div>
   <div style="margin-top:12px" id="tcStages">
     <div class="tc-stage" data-s="0"><span class="ag-ic"><span class="s-ring"></span></span>Checking provider</div>
     <div class="tc-stage" data-s="1"><span class="ag-ic"><span class="s-ring"></span></span>Checking API key</div>
     <div class="tc-stage" data-s="2"><span class="ag-ic"><span class="s-ring"></span></span>Checking model</div>
   </div>
   <div class="dlg-btns" style="justify-content:center;margin-top:16px" id="tcActs"></div>`;
  ov.appendChild(d);document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('on'));
  const close=()=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),220);};
  const stages=[...d.querySelectorAll('.tc-stage')];
  const resetStages=()=>stages.forEach(s=>{s.className='tc-stage';
    s.querySelector('.ag-ic').innerHTML='<span class="s-ring"></span>';});
  const setStage=(i,state)=>{const s=stages[i];if(!s)return;
    s.className='tc-stage'+(state==='run'?'':' st-'+state);
    s.querySelector('.ag-ic').innerHTML=state==='run'?'<span class="s-ring"></span>':ic(state==='ok'?'ok':state==='err'?'err':'warn');};
  const showFail=err=>{
    d.querySelector('#tcBig').innerHTML=`<div class="errc">${ic('close')}</div>`;
    d.querySelector('#tcMsg').textContent='Connection failed';
    d.querySelector('#tcSub').textContent=String(err).slice(0,300);
    const acts=d.querySelector('#tcActs');acts.innerHTML='';
    const retry=el('button','btn',ic('refresh')+'<span>Retry</span>');
    retry.onclick=()=>{resetStages();
      d.querySelector('#tcBig').innerHTML='<span class="s-ring"></span>';
      d.querySelector('#tcMsg').textContent='Connecting to AI…';
      d.querySelector('#tcSub').textContent='Provider: '+p.name+' · '+hostOf(p.base);
      run();};
    const cancel=el('button','btn ghost','Close');cancel.onclick=close;
    acts.append(retry,cancel);};
  const showOk=warn=>{
    d.querySelector('#tcBig').innerHTML=`<div class="okc">${ic('check')}</div>`;
    d.querySelector('#tcMsg').textContent='Connected';
    d.querySelector('#tcSub').textContent=warn||('AI Provider is ready · '+p.model);
    const acts=d.querySelector('#tcActs');acts.innerHTML='';
    const done=el('button','btn','Done');
    done.onclick=()=>{close();S.selProviderId=p.id;save('sel',p.id);updatePills();onDone&&onDone();};
    acts.appendChild(done);};
  const run=async()=>{const res=await testProvider(p,(i,st,msg)=>{
      setStage(i,st);if(st==='warn'&&msg)d.querySelector('#tcSub').textContent=msg;});
    res.ok?showOk(res.warn):showFail(res.err);};
  run();}

function scaffold(type,name,pkg,ver){

  const put=(p,c)=>{F[p]={c,ts:Date.now()};
    const i=p.lastIndexOf('/');if(i>0){const d=p.slice(0,i);if(!folders.includes(d))folders.push(d);}};
  if(type==='web'){
    put('index.html','<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+name+'</title>\n<link rel="stylesheet" href="css/style.css">\n</head>\n<body>\n  <main class="app">\n    <h1>'+name+'</h1>\n    <p>Welcome to your new web app. Ask the Coding Agent to build your screens.</p>\n    <button id="cta">Get started</button>\n  </main>\n  <script src="js/app.js"><\/script>\n</body>\n</html>');
    put('css/style.css','*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:system-ui,sans-serif;background:#f6f6f6;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center}\n.app{text-align:center;padding:32px}\nh1{font-size:28px;margin-bottom:12px}\np{color:#555;margin-bottom:20px}\n#cta{border:0;background:#111;color:#fff;padding:12px 22px;border-radius:12px;font-size:15px;cursor:pointer}');
    put('js/app.js',"document.getElementById('cta').addEventListener('click',()=>{\n  alert('Let\\'s build "+name+"!');\n});");
    put('README.md','# '+name+'\n\nWeb app scaffolded by Flay AI Coding Agent.\n\n- `index.html` — entry page\n- `css/style.css` — styles\n- `js/app.js` — logic\n');
  }else{
    const isK=type==='kotlin',pkgPath=pkg.split('.').join('/');
    put('settings.gradle','pluginManagement {\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = "'+name+'"\ninclude \':app\'');

function renderTree(){const tree=$('#fsTree');if(!tree||!S.android)return;
  const root=projTree();const rows=[];
  (function walk(node,depth,prefix){
    const dirs=Object.keys(node.d).sort(),files=Object.keys(node.f).sort();
    for(const d of dirs){const p=prefix?prefix+'/'+d:d;const open=S.fsOpen.has(p);
      rows.push({k:'d',name:d,depth,path:p,open});
      if(open)walk(node.d[d],depth+1,p);}
    for(const fn of files)rows.push({k:'f',name:fn,depth,path:node.f[fn]});
  })(root,0,'');
  if(!rows.length){tree.innerHTML=`<div class="fs-empty">This project is empty.<br>Command the Coding Agent in chat, or create a file.<br><button class="btn sm" id="fsGoAgent">${ic('bot')}Open Coding Agent</button></div>`;
    const b=tree.querySelector('#fsGoAgent');
    if(b)b.onclick=()=>{closeRoot();scrollBottom(true);inp.focus();};
    return;}
  tree.innerHTML=rows.map(r=>{
    const selc=r.k==='f'&&S.fsSel.has(r.path);
    if(r.k==='d')return`<div class="fs-row${r.open?' open':''}" data-kind="d" data-path="${esc(r.path)}" style="--d:${r.depth}">
      <span class="fs-chev">${ic('chev-r')}</span><span class="fdir">${ic(r.open?'folder-o':'folder-f')}</span>
      <span class="fs-name">${esc(r.name)}</span><span class="fs-chk">${ic('check')}</span></div>`;
    return`<div class="fs-row${selc?' sel':''}" data-kind="f" data-path="${esc(r.path)}" style="--d:${r.depth}">
      <span class="fs-chev ghost">${ic('chev-r')}</span>${extIcon(r.path,24)}
      <span class="fs-name">${esc(r.name)}</span><span class="fs-chk">${ic('check')}</span></div>`;}).join('');}
function refreshSel(){if(!rootLayer)return;
  rootLayer.root.querySelectorAll('.fs-row').forEach(r=>{
    r.classList.toggle('sel',r.dataset.kind==='f'&&S.fsSel.has(r.path));});
  updateRootHeader();}
function bindFsEvents(wrap){
  let lp={t:null,fired:false,x:0,y:0};
  wrap.addEventListener('pointerdown',e=>{const row=e.target.closest('.fs-row');if(!row)return;
    lp.fired=false;lp.x=e.clientX;lp.y=e.clientY;
    lp.t=setTimeout(()=>{lp.fired=true;
      if(row.dataset.kind==='f'){const p=row.dataset.path;
        if(S.fsSel.has(p))S.fsSel.delete(p);else S.fsSel.add(p);
        if(navigator.vibrate)navigator.vibrate(25);
        refreshSel();}},430);});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>wrap.addEventListener(ev,()=>clearTimeout(lp.t)));
  wrap.addEventListener('pointermove',e=>{if(lp.t&&(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10))clearTimeout(lp.t);});
  wrap.addEventListener('click',e=>{if(lp.fired){lp.fired=false;return;}
    const row=e.target.closest('.fs-row');if(!row)return;
    if(row.dataset.kind==='d'){const p=row.dataset.path;
      if(S.fsOpen.has(p))S.fsOpen.delete(p);else S.fsOpen.add(p);
      saveAndroid();renderTree();}
    else openPreview(row.dataset.path);});
  wrap.addEventListener('contextmenu',e=>{if(e.target.closest('.fs-row'))e.preventDefault();});}

  mkDir.onclick=()=>{const p=readPath();if(!p)return;

function openPreview(path){
  const inProj=!!(S.android&&path in S.android.files);
  const f=inProj?S.android.files[path]:chatFiles.get(path);
  if(f==null){toast('File not found','err');return;}
  const ext=getExt(path);
  const previewable=['html','htm'].includes(ext)||IMG_EXTS.has(ext);
  const V=el('div','viewer');
  V.innerHTML=`
   <div class="v-top"><button class="fbtn sm" id="pvClose" aria-label="Close">${ic('close')}</button>
     <span class="v-title">${extIcon(path,22)}<b>${esc(baseName(path))}</b><span class="v-badge">${esc((ext||'FILE').toUpperCase().slice(0,5))}</span></span>
     <button class="btn sm ghost" id="pvCopy">${ic('copy')}<span>Copy</span></button>
     ${inProj?`<button class="fbtn sm" id="pvDel" aria-label="Delete file">${ic('trash')}</button>`:''}</div>
   ${previewable?`<div class="v-tabs"><button id="tabCode" class="on">Code</button><button id="tabPrev">Preview</button></div>`:''}
   <div class="v-body"></div>`;
  document.body.appendChild(V);requestAnimationFrame(()=>V.classList.add('on'));
  const bodyEl=V.querySelector('.v-body');
  const renderCode=()=>{bodyEl.innerHTML='<div class="v-code"></div>';const c=bodyEl.firstChild;
    const lines=String(f.c).split('\n');
    c.innerHTML=lines.map((l,i)=>`<div class="cl"><span class="ln">${i+1}</span><span class="lc">${esc(l)||' '}</span></div>`).join('')||'<div class="pv-msg">Empty file</div>';};
  const renderPrev=()=>{bodyEl.innerHTML='<div class="v-preview"></div>';const pv=bodyEl.firstChild;
    if(ext==='svg'){const img=el('img','pv-img');img.src='data:image/svg+xml;utf8,'+encodeURIComponent(f.c);pv.appendChild(img);}
    else if(IMG_EXTS.has(ext)){try{const img=el('img','pv-img');
      img.src='data:image/'+(ext==='jpg'?'jpeg':ext)+';base64,'+btoa(unescape(encodeURIComponent(f.c)));
      img.onerror=()=>{img.remove();pv.appendChild(el('div','pv-msg','Cannot display this image.'));};
      pv.appendChild(img);}catch{pv.appendChild(el('div','pv-msg','Cannot display this image.'));}}
    else if(['html','htm'].includes(ext)&&inProj){
      const dir=path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'';
      let html=f.c;
      html=html.replace(/<link[^>]*href=["']([^"']+)["'][^>]*>/gi,(m,href)=>{
        if(!/\.css(\?|$)/.test(href))return m;
        const ref=href.split('?')[0].replace(/^\.\//,'');
        const p=ref.startsWith('/')?ref.slice(1):dir+ref;
        return S.android.files[p]?`<style>${S.android.files[p].c}</style>`:m;});
      html=html.replace(/<script[^>]*src=["']([^"']+)["'][^>]*>\s*<\/script>/gi,(m,src)=>{
        const ref=src.split('?')[0].replace(/^\.\//,'');
        const p=ref.startsWith('/')?ref.slice(1):dir+ref;
        return S.android.files[p]?`<script>${S.android.files[p].c}<\/script>`:m;});
      const fr=el('iframe','pv-frame');fr.sandbox='allow-scripts';pv.appendChild(fr);fr.srcdoc=html;}
    else pv.appendChild(el('div','pv-msg','Preview not available for this file type.'));};
  renderCode();
  if(previewable){const tC=V.querySelector('#tabCode'),tP=V.querySelector('#tabPrev');
    tC.onclick=()=>{tC.classList.add('on');tP.classList.remove('on');renderCode();};
    tP.onclick=()=>{tP.classList.add('on');tC.classList.remove('on');renderPrev();};}
  V.querySelector('#pvClose').onclick=()=>{V.classList.remove('on');setTimeout(()=>V.remove(),220);};
  V.querySelector('#pvCopy').onclick=e=>copyText(f.c,e.currentTarget);
  const del=V.querySelector('#pvDel');
  if(del)del.onclick=()=>{
    confirmDialog({title:'Delete file?',body:baseName(path)+' will be permanently removed from the project.',danger:true,okLabel:'Delete'})
    .then(ok=>{if(!ok)return;
      delete S.android.files[path];saveAndroid();renderTree();updateRootStats();
      V.classList.remove('on');setTimeout(()=>V.remove(),220);toast('File deleted','ok');});};}

/* ================= EXPORT (real ZIP — store method) ================= */
function crc32(u8){let t=crc32.t;if(!t){t=crc32.t=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}}
  let cr=-1;for(let i=0;i<u8.length;i++)cr=(cr>>>8)^t[(cr^u8[i])&0xFF];return(cr^-1)>>>0;}
function makeZip(files){const chunks=[],central=[];let off=0;const d=new Date();
  const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){const name=enc8.encode(f.path),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);
    chunks.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;}
  let cs=0;for(const c of central)cs+=c.length;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...central,new Uint8Array(end.buffer)],{type:'application/zip'});}
function exportProject(){const a=S.android;if(!a)return;
  const files=Object.keys(a.files).map(p=>({path:p,data:enc8.encode(a.files[p].c)}));
  if(!files.length){toast('Project is empty','err');return;}
  toast('Packing project…');
  downloadBlob(a.name.replace(/\s+/g,'-').toLowerCase()+'-source.zip',makeZip(files));
  toast(files.length+' files exported as ZIP','ok');}

 $('#btnAndroidInfo').onclick=()=>openProjectInfo();
 $('#btnAndroidMore').onclick=e=>{e.stopPropagation();
  const pop=$('#androidMorePop');pop.hidden=false;requestAnimationFrame(()=>pop.classList.add('on'));};
document.addEventListener('click',e=>{
  const pop=$('#androidMorePop');
  if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('#btnAndroidMore')){
    pop.classList.remove('on');setTimeout(()=>pop.hidden=true,160);}});
function closeMorePop(){const pop=$('#androidMorePop');pop.classList.remove('on');setTimeout(()=>pop.hidden=true,160);}
 $('#btnAndroidPopNew').onclick=()=>{closeMorePop();newChat();setAndroidMode(true);};
 $('#btnAndroidPopTheme').onclick=()=>toggleTheme();
 $('#btnAndroidPopExit').onclick=()=>{closeMorePop();
  if(S.streaming&&S.abort)S.abort.abort();
  setAndroidMode(false);toast('Exited Android workspace');};

/* ================= INIT ================= */
(function init(){
  updatePills();
  $('#prLabel').textContent=S.reason;
  renderEmptyState();
  updateProjectBar();
  const last=S.chats[0];if(last)loadChat(last.id);
  setSendState();autoGrow();
})();
</script>
</body>
</html>
