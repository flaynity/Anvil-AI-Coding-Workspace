name: Validate Flay AI inline JavaScript

on:
  pull_request:
  push:
    branches: [main]

jobs:
  inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and syntax-check app script
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>", html, re.I)
          app = next((x for x in scripts if "'use strict'" in x), None)
          if app is None:
              raise SystemExit("Could not find the main inline app script")
          Path("/tmp/flay-app.js").write_text(app, encoding="utf-8")
          print(f"Extracted {len(app)} characters from the main app script")
          PY
          node --check /tmp/flay-app.js
