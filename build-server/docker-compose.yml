services:
  flay-ai-build-server:
    build:
      context: ..
      dockerfile: build-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BUILD_TIMEOUT_MS: "1200000"
      BUILD_TOKEN: "${BUILD_TOKEN:-}"
    volumes:
      - gradle-cache:/opt/gradle-cache
    restart: unless-stopped

volumes:
  gradle-cache:
