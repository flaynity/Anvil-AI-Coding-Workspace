<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<title>Flay AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --tx:#111111; --tx2:#4D4D4D; --tx3:#767676;
  --line:#D9D9D9; --hair:#ECECEC; --soft:#F4F4F4; --soft2:#FAFAFA;
  --red:#D80E45; --red-deep:#8A0B30;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk','Segoe UI',Tahoma,sans-serif;
  --sh:0 12px 32px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font:500 15px/1.5 var(--sans);color:var(--tx);background:var(--bg);position:fixed;inset:0}
::selection{background:#000;color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #000;outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .fl{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* ===== Floating top bar ===== */
#topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;pointer-events:none;
  background:linear-gradient(180deg,var(--bg) 30%,rgba(255,255,255,0))}
.fbtn{pointer-events:auto;width:46px;height:46px;flex:none;border-radius:15px;background:#fff;color:var(--tx);
  border:1px solid rgba(0,0,0,.05);box-shadow:0 6px 20px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.fbtn:active{transform:scale(.92)}
.fbtn .ic{width:21px;height:21px}
.fbtn.sm{width:38px;height:38px;border-radius:12px;box-shadow:none;border-color:var(--hair)}
.fbtn.sm .ic{width:18px;height:18px}
.fbtn.dim{color:var(--tx2)}

/* ===== Android Coding Agent — Floating Glass Top Bar ===== */
#androidTopBar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;z-index:15;
  display:flex;align-items:center;gap:9px;padding:8px 10px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(0,0,0,.06);border-radius:20px;box-shadow:0 10px 32px rgba(0,0,0,.12)}
.ba-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ba-logo{width:36px;height:36px;border-radius:11px;object-fit:cover;background:#000;flex:none;
  box-shadow:0 3px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:#3DDC84;overflow:hidden}
.ba-logo .ic{width:22px;height:22px}
.ba-logo img{width:100%;height:100%;object-fit:cover}
.ba-meta{min-width:0;flex:1}
.ba-meta b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ba-acts{display:flex;align-items:center;gap:6px;flex:none}
.bbtn{padding:0 13px;height:34px;font-size:13px;font-weight:800;border-radius:11px;background:#000;color:#fff;
  display:flex;align-items:center;gap:6px;box-shadow:0 5px 14px rgba(0,0,0,.2);transition:.12s}
.bbtn:active{transform:scale(.94)}
.bbtn .ic{width:15px;height:15px}
@media(max-width:430px){.bbtn span{display:none}.bbtn{padding:0 11px}}

#projectBar{flex:none;display:flex;align-items:center;gap:10px;margin:calc(env(safe-area-inset-top) + 64px) 12px 0;
  padding:9px 10px 9px 14px;border:1px solid var(--hair);border-radius:16px;background:var(--soft2)}
#projectBar>.ic{color:var(--tx2)}
.pb-m{flex:1;min-width:0}
.pb-m b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-m span{font-size:12px;color:var(--tx3);font-weight:500}

#chatScroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#thread{max-width:780px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 82px) 14px 24px}
#thread.am-pad{padding-top:calc(env(safe-area-inset-top) + 112px)}
#emptyState{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 120px}
.es-mark{width:56px;height:56px;border-radius:18px;background:#000;color:var(--red);display:flex;align-items:center;justify-content:center;
  font:italic 700 30px var(--sans);letter-spacing:-1px;margin-bottom:20px;box-shadow:0 10px 28px rgba(0,0,0,.14)}
.es-mark.am-mode{background:#000;color:#3DDC84;font-style:normal;font-size:0;box-shadow:0 10px 26px rgba(47,158,68,.25)}
.es-mark.am-mode .ic{width:36px;height:36px}
#emptyState h1{font-size:28px;font-weight:700;letter-spacing:-.8px;margin-bottom:10px}
#emptyState p{max-width:370px;font-size:14.5px;line-height:1.65;color:var(--tx2);font-weight:500;margin-bottom:24px}
.es-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:430px}
.chip{border:1px solid var(--line);border-radius:22px;padding:9px 15px;font-size:13px;font-weight:700;background:#fff;transition:.15s}
.chip:hover{border-color:#000}
.chip:active{transform:scale(.96)}

.msg{display:flex;gap:10px;margin:20px 0}
.msg.user{flex-direction:column;align-items:flex-end;gap:6px}
.u-bubble{background:#000;color:#fff;border-radius:18px 18px 5px 18px;padding:11px 15px;max-width:84%;
  font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.u-bubble.clamp{display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.u-bubble code{background:rgba(255,255,255,.16);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:13px}
.more-btn{border:1px solid var(--line);border-radius:14px;padding:4px 13px;font-size:12px;font-weight:700;color:var(--tx2)}
.more-btn:hover{border-color:#000;color:#000}
.u-atts{display:flex;flex-wrap:wrap;gap:6px;max-width:84%;justify-content:flex-end}
.att-mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;
  padding:4px 8px;font-size:12px;color:var(--tx2);background:#fff;max-width:220px}
.att-mini img{width:22px;height:22px;border-radius:6px;object-fit:cover}
.att-mini .ic{width:14px;height:14px}
.att-mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-mini.am-tagged{background:#F0FAF2;border-color:#BFE3C6;color:#14571F;font-weight:700}

.msg.ai{align-items:flex-start}
.ai-main{flex:1;min-width:0}
.think-row{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:13.5px;font-weight:700;padding:3px 0}
.think-row .ic{width:17px;height:17px;animation:think 1.5s ease-in-out infinite}
@keyframes think{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.16);opacity:1}}
.caret{display:inline-block;width:8px;height:15px;background:#000;margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.seg-t{font-size:15px;line-height:1.65;word-break:break-word;margin:4px 0;font-weight:500}
.seg-t .md-h{display:block;font-weight:700;font-size:16px;margin:10px 0 2px}
.seg-t code{background:var(--soft);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:13px}
.seg-t b{font-weight:700}
.seg-t .md-li{color:var(--tx2);display:block;margin:2px 0}

.codebox{border:1px solid #DCDCDC;border-radius:14px;overflow:hidden;margin:10px 0;background:#FCFCFC}
.cb-head{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;background:var(--soft);border-bottom:1px solid var(--hair)}
.cb-lang{flex:1;font:700 11.5px var(--mono);letter-spacing:.5px;color:var(--tx2);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-copy{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:4px 9px;font-size:12px;font-weight:700}
.cb-copy .ic{width:13px;height:13px}
.cb-copy.done{border-color:#1E7D32;color:#1E7D32}
.codebox pre{margin:0;padding:12px 14px;overflow:auto;max-height:420px}
.codebox code{font:12.5px/1.6 var(--mono);white-space:pre;tab-size:2}

.build-progress{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0;max-width:480px;font-size:13.5px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.bp-hdr{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--soft2);font-weight:700;border-bottom:1px solid var(--hair)}
.bp-hdr .spin{width:15px;height:15px;border-width:2.5px}
.bp-hdr.success{background:#F3FBF5;color:#176C29;border-color:#D8EFDD}
.bp-step{display:flex;align-items:center;gap:10px;padding:9px 15px;font-weight:500;color:var(--tx2)}
.bp-step .ic{width:16px;height:16px;color:var(--tx3);flex:none}
.bp-step.done{color:#000;font-weight:600}
.bp-step.done .ic{color:#1E7D32}
.bp-step.act{color:#000;font-weight:700}
.bp-acts{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--soft2);flex-wrap:wrap}

.stop-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;
  padding:4px 11px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.stop-chip .ic{width:13px;height:13px}
.err-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--red);
  background:var(--soft2);border-radius:12px;padding:11px 12px;margin:8px 0;max-width:420px}
.err-card>.ic{color:var(--red);width:18px;height:18px;margin-top:1px}
.ec-t{flex:1;min-width:0}
.ec-t b{display:block;font-size:13.5px;font-weight:700}
.ec-t p{font-size:12.5px;color:var(--tx2);margin-top:2px;white-space:pre-wrap;word-break:break-word}

/* ===== Composer ===== */
#composerWrap{flex:none;position:relative;padding:6px 12px calc(env(safe-area-inset-bottom) + 12px);background:var(--bg)}
#composer{border:1px solid #DBDBDB;border-radius:26px;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.06);
  max-width:780px;margin:0 auto;overflow:hidden;z-index:25;position:relative}
#attachRow{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 0}
.att-chip{flex:none;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;padding:6px 8px;max-width:250px}
.att-chip.am-chip{background:#F0FAF2;border-color:#BFE3C6}
.att-th{width:36px;height:36px;border-radius:9px;object-fit:cover}
.att-ic{width:36px;height:36px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.att-ic.am{background:#DFF3E3;color:#1e7d32;border:1px solid #c7dfc8;font:800 10px var(--mono)}
.att-m{min-width:0}
.att-m b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.att-s{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3);font-weight:600}
.att-x{color:var(--tx3);padding:2px}
.att-x .ic{width:14px;height:14px}
#input{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--tx);
  font:500 15.5px/1.5 var(--sans);padding:14px 16px 4px;max-height:36vh}
#input::placeholder{color:#9A9A9A}
.controls{display:flex;align-items:center;gap:4px;padding:4px 6px 6px;min-width:0;flex-wrap:nowrap}
.cbtn{width:36px;height:36px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.cbtn:hover{background:var(--soft);color:#000}
.cbtn .ic{width:19px;height:19px}
.pill{flex:1 1 auto;min-width:0;max-width:150px;display:flex;align-items:center;gap:5px;height:32px;padding:0 9px;
  border:1px solid var(--line);border-radius:16px;font-size:12px;font-weight:700;color:var(--tx2)}
.pill .pl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pill .ic{width:14px;height:14px;flex:none}
.pill:hover{border-color:#000;color:#000}
@media(max-width:430px){.pill{max-width:none;padding:0 8px}.pill .chev{display:none}}
#btnSend{width:40px;height:40px;flex:none;border-radius:50%;background:#000;color:#fff;display:flex;
  align-items:center;justify-content:center;transition:transform .12s,background .2s,opacity .2s}
#btnSend:active{transform:scale(.92)}
#btnSend.stream{background:var(--red)}
#btnSend.dim{opacity:.35}
#btnSend .ic{width:19px;height:19px}

#attachPop{position:absolute;bottom:calc(100% + 10px);left:14px;z-index:40;background:#fff;border:1px solid var(--hair);
  border-radius:16px;box-shadow:var(--sh);padding:6px;min-width:200px;transform-origin:bottom left;transform:scale(.95);opacity:0;transition:.15s;pointer-events:none}
#attachPop.on{transform:none;opacity:1;pointer-events:auto}
#attachPop button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:11px;font-size:14px;font-weight:600;text-align:left}
#attachPop button:hover{background:var(--soft)}
#attachPop .ic{width:18px;height:18px;color:var(--tx2)}
#scrollBtn{position:absolute;bottom:calc(100% + 12px);right:16px;width:38px;height:38px;border-radius:50%;
  background:#000;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);z-index:20}
#scrollBtn .ic{width:18px;height:18px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.ov.on{opacity:1}
.ov.left{justify-content:flex-start;align-items:stretch}
.sheet{background:#fff;width:100%;max-width:560px;max-height:84vh;max-height:84dvh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;transform:translateY(26px);transition:transform .22s cubic-bezier(.2,.7,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.ov.on .sheet{transform:none}
@media(min-width:760px){.ov:not(.left){align-items:center}.ov:not(.left) .sheet{border-radius:20px}}
.sh-grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0;flex:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--hair);flex:none}
.sh-head h3{flex:1;font-size:16px;font-weight:700}
.sh-body{overflow-y:auto;padding:14px 18px 20px}
.dlg-ov{z-index:90;align-items:center}
.dlg{background:#fff;border-radius:18px;max-width:380px;width:calc(100% - 32px);padding:20px;box-shadow:var(--sh);transform:translateY(10px);transition:transform .2s}
.ov.on .dlg{transform:none}
.dlg h3{font-size:17px;font-weight:700;margin-bottom:8px}
.dlg-b{font-size:13.5px;color:var(--tx2);line-height:1.6;white-space:pre-wrap;margin-bottom:18px}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 18px;border-radius:12px;
  background:#000;color:#fff;font-size:14px;font-weight:700;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn .ic{width:16px;height:16px}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#000}
.btn.danger{background:var(--red)}
.btn.sm{height:34px;padding:0 13px;font-size:13px;border-radius:10px}

/* ===== Premium Menu Drawer ===== */
.drawer{width:min(88vw,380px);height:100%;background:#fff;display:flex;flex-direction:column;
  transform:translateX(-40px);opacity:.6;transition:transform .24s cubic-bezier(.2,.7,.3,1),opacity .2s;
  padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:env(safe-area-inset-bottom)}
.ov.on .drawer{transform:none;opacity:1}
.dw-head{display:flex;align-items:center;gap:13px;padding:14px 16px 14px}
.dw-logo{width:54px;height:54px;flex:none;border-radius:17px;background:#000;color:var(--red);
  display:flex;align-items:center;justify-content:center;font:italic 700 30px var(--sans);letter-spacing:-1px;
  box-shadow:0 8px 22px rgba(0,0,0,.16)}
.dw-title{flex:1;min-width:0}
.dw-title b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.dw-title b em{color:var(--red);font-style:normal}
.dw-title>span{display:block;font-size:12.5px;font-weight:600;color:var(--tx3);margin-top:3px;letter-spacing:.2px}
.dw-body{flex:1;overflow-y:auto;padding:2px 14px 12px}
.dwi{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--hair);border-radius:19px;padding:12px 13px;margin-bottom:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);transition:transform .16s,box-shadow .16s,border-color .16s;
  opacity:0;transform:translateY(16px) scale(.96)}
.ov.on .dwi{animation:dwIn .5s cubic-bezier(.2,.7,.3,1.12) forwards}
.ov.on .dw-body .dwi:nth-child(1){animation-delay:.04s}
.ov.on .dw-body .dwi:nth-child(2){animation-delay:.09s}
.ov.on .dw-body .dwi:nth-child(3){animation-delay:.14s}
.ov.on .dw-body .dwi:nth-child(4){animation-delay:.19s}
.ov.on .dw-body .dwi:nth-child(5){animation-delay:.24s}
@keyframes dwIn{to{opacity:1;transform:none}}
.dwi:hover{transform:translateY(-2px)!important;box-shadow:0 10px 26px rgba(0,0,0,.10);border-color:#DBDBDB}
.dwi:active{transform:scale(.97)!important}
.tile2{width:48px;height:48px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:inset 0 -3px 8px rgba(0,0,0,.18),0 5px 13px rgba(0,0,0,.13)}
.tile2 .ic{width:24px;height:24px;stroke-width:2}
.g-chat{background:linear-gradient(135deg,#5B9BFF,#1D6FEB)}
.g-proj{background:linear-gradient(135deg,#A96BFF,#6C3BD9)}
.g-ai{background:linear-gradient(135deg,#22D3A5,#0B8F6B)}
.g-android{background:linear-gradient(135deg,#7CE38B,#2F9E44)}
.g-del{background:linear-gradient(135deg,#FF6B8F,#D80E45)}
.dwi-m{flex:1;min-width:0}
.dwi-m>b{display:block;font-size:16px;font-weight:700;letter-spacing:-.2px}
.dwi-m>small{display:block;font-size:11.5px;color:var(--tx3);font-weight:600;margin-top:1px}
.dwi .chev{width:18px;height:18px;color:#B5B5B5;flex:none}
.dwi.danger>b{color:var(--red)}
.hist-wrap{display:none;margin:-2px 0 10px;padding:0 4px}
.hist-wrap.on{display:block;animation:dwIn .3s both}
.hist-list{margin:0;padding:0}
.h-row{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 10px;border-radius:13px}
.h-row:hover{background:var(--soft)}
.h-m{flex:1;min-width:0;cursor:pointer}
.h-m b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-m span{font-size:11.5px;color:var(--tx3);font-weight:500}
.h-x{color:var(--tx3);padding:6px}
.h-x .ic{width:15px;height:15px}
.h-empty{font-size:13px;font-weight:600;color:var(--tx3);padding:8px 10px}
.dw-foot{flex:none;display:flex;align-items:center;gap:12px;margin:0 14px;padding:14px 2px 6px;border-top:1px solid var(--hair)}
.dw-foot .ic{color:var(--tx3);width:20px;height:20px;flex:none}
.dw-foot .sep{width:1px;align-self:stretch;background:var(--hair)}
.dw-foot p{font-size:12px;font-weight:500;color:var(--tx2);line-height:1.55}
.prem{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#0A0A0A;border-radius:20px;padding:15px 14px;margin:2px 0 14px;color:#fff}
.prem::before{content:"";position:absolute;right:-26px;top:-45%;width:96px;height:190%;background:var(--red);transform:skewX(-20deg)}
.prem::after{content:"";position:absolute;right:58px;top:-45%;width:18px;height:190%;background:rgba(216,14,69,.5);transform:skewX(-20deg)}
.prem .crown{position:relative;z-index:1;width:34px;height:34px;flex:none;color:#F0A500}
.prem-t{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column}
.prem-t b{font-size:20px;font-weight:700;letter-spacing:-.3px}
.prem-t>span{font-size:12.5px;color:#D9D9D9;font-weight:500;margin-top:1px}
.prem-pill{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:6px;background:var(--red);color:#fff;
  border-radius:999px;padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.8px}

/* ===== Fullscreen page layers ===== */
.am-layer{position:fixed;inset:0;background:#fff;z-index:85;display:flex;flex-direction:column;opacity:0;transform:translateY(14px);transition:.24s cubic-bezier(.2,.7,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.am-layer.on{opacity:1;transform:none}
.am-header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 16px 12px;border-bottom:1px solid var(--hair);background:#fff}
.am-title{flex:1;min-width:0}
.am-title h2{font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-title span{font-size:12px;color:var(--tx3);font-weight:600}
.am-body{flex:1;overflow-y:auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:16px;max-width:640px;width:100%;margin:0 auto}
.am-p{font-size:14.5px;color:var(--tx2);font-weight:500;line-height:1.6}

/* ===== Tech select — Premium 1:1 cards ===== */
.tc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px}
@media(max-width:359px){.tc-grid{grid-template-columns:1fr}}
.tc-card{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  background:#fff;border:2px solid var(--hair);border-radius:24px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .2s,background .2s,box-shadow .2s;opacity:0;transform:translateY(20px) scale(.94)}
.am-layer.on .tc-card{animation:tcIn .55s cubic-bezier(.2,.7,.3,1.18) forwards}
.am-layer.on .tc-grid .tc-card:nth-child(1){animation-delay:.06s}
.am-layer.on .tc-grid .tc-card:nth-child(2){animation-delay:.14s}
.am-layer.on .tc-grid .tc-card:nth-child(3){animation-delay:.22s}
@keyframes tcIn{to{opacity:1;transform:none}}
.tc-card:hover{box-shadow:0 16px 34px rgba(0,0,0,.09)}
.tc-card.active{border-color:#000;background:var(--soft2);box-shadow:0 12px 30px rgba(0,0,0,.11)}
.tc-glow{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;
  filter:blur(34px);opacity:0;transition:.25s}
.tc-card.active .tc-glow{opacity:.55}
.tc-ic{width:66px;height:66px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;z-index:1;
  box-shadow:inset 0 -4px 10px rgba(0,0,0,.22),0 8px 20px rgba(0,0,0,.16);transition:transform .25s}
.tc-card:hover .tc-ic{transform:scale(1.07) rotate(-3deg)}
.tc-ic .ic{width:36px;height:36px}
.tc-card h3{font-size:16.5px;font-weight:800;letter-spacing:-.2px;position:relative;z-index:1}
.tc-card p{font-size:11.5px;color:var(--tx3);font-weight:600;line-height:1.45;padding:0 10px;position:relative;z-index:1}
.tc-chk2{position:absolute;top:11px;right:11px;width:25px;height:25px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:transparent;transition:.2s;z-index:2;background:#fff}
.tc-chk2 .ic{width:12px;height:12px;stroke-width:3.2}
.tc-card.active .tc-chk2{background:#000;border-color:#000;color:#fff;animation:tickIn .28s cubic-bezier(.2,.7,.3,1.5)}
.gr-kotlin{background:linear-gradient(135deg,#9B6BFF,#6C3BD9)}
.gr-java{background:linear-gradient(135deg,#FF8A65,#E64A19)}
.gr-html{background:linear-gradient(135deg,#FF8A4C,#E44D26)}

/* bold CTA */
.btn-big{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:58px;border-radius:18px;
  background:#000;color:#fff;font-size:16px;font-weight:800;letter-spacing:.2px;
  box-shadow:0 12px 28px rgba(0,0,0,.24);transition:.15s;margin-top:8px}
.btn-big:active{transform:scale(.98)}
.btn-big:disabled{opacity:.35;transform:none;cursor:not-allowed}
.btn-big .ic{width:19px;height:19px}

/* ===== Create Project Info page ===== */
.cpi-hero{display:flex;flex-direction:column;align-items:center;gap:13px;margin:4px 0 10px}
.ic-prv-big{width:116px;height:116px;border-radius:32px;background:#000;color:#3DDC84;display:flex;align-items:center;justify-content:center;
  overflow:hidden;box-shadow:0 16px 38px rgba(0,0,0,.2),inset 0 -6px 14px rgba(255,255,255,.08);border:3px solid #fff;outline:1px solid var(--hair)}
.ic-prv-big .ic{width:52px;height:52px}
.ic-prv-big img{width:100%;height:100%;object-fit:cover}
.upl-btn{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:15px;padding:11px 19px;
  font-size:13.5px;font-weight:700;color:var(--tx2);transition:.15s;background:#fff}
.upl-btn:hover{border-color:#000;color:#000}
.upl-btn:active{transform:scale(.96)}
.upl-btn .ic{width:17px;height:17px}

/* ===== 3-Dot popup ===== */
.scrim{position:fixed;inset:0;z-index:95}
.pop3{position:fixed;z-index:96;min-width:238px;background:#fff;border:1px solid var(--hair);border-radius:19px;
  box-shadow:0 20px 48px rgba(0,0,0,.2);padding:7px;transform-origin:top right;transform:scale(.85) translateY(-8px);
  opacity:0;transition:.18s cubic-bezier(.2,.7,.3,1.3);pointer-events:none}
.pop3.on{transform:none;opacity:1;pointer-events:auto}
.pop3 button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:13px;font-size:14.5px;font-weight:700;text-align:left;transition:.12s}
.pop3 button:hover{background:var(--soft)}
.pop3 button:active{transform:scale(.97)}
.pop3 .tile3{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
  box-shadow:inset 0 -2px 5px rgba(0,0,0,.16)}
.pop3 .tile3 .ic{width:17px;height:17px}
.pop3 .danger-t{color:var(--red)}
.pop3-h{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);padding:7px 12px 4px}

/* ===== Project Information page ===== */
.prj-card{border:1px solid var(--hair);border-radius:21px;background:#fff;padding:16px;margin-bottom:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.05);transition:box-shadow .18s;opacity:0;transform:translateY(18px)}
.panel.on .prj-card{animation:tcIn .5s cubic-bezier(.2,.7,.3,1.1) forwards}
.prj-card:hover{box-shadow:0 12px 30px rgba(0,0,0,.1)}
.prj-h{display:flex;align-items:center;gap:13px;cursor:pointer}
.prj-logo{width:56px;height:56px;border-radius:17px;background:#000;color:#3DDC84;display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.16)}
.prj-logo img{width:100%;height:100%;object-fit:cover}
.prj-logo .ic{width:28px;height:28px}
.prj-m{flex:1;min-width:0}
.prj-m b{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prj-m span{font:600 11.5px var(--mono);color:var(--tx3)}
.prj-tags{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
.prj-tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;border:1px solid var(--hair);border-radius:999px;padding:4px 11px;color:var(--tx2);background:var(--soft2)}
.prj-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pa-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;height:35px;padding:0 14px;
  font-size:12.5px;font-weight:700;background:#fff;transition:.13s}
.pa-btn:hover{border-color:#000}
.pa-btn:active{transform:scale(.94)}
.pa-btn .ic{width:14px;height:14px}
.pa-btn.danger{color:var(--red);border-color:#F0C6D2}
.pa-btn.danger:hover{border-color:var(--red)}
.prj-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:52px 20px;color:var(--tx3);text-align:center}
.prj-empty .ic{width:42px;height:42px;opacity:.5}
.prj-empty p{font-size:13.5px;font-weight:600}

/* ===== App Code Root ===== */
.fs-top-send{display:inline-flex;align-items:center;gap:7px;background:#000;color:#fff;border-radius:12px;height:37px;
  padding:0 13px;font-size:12.5px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.18);transition:.15s;flex:none}
.fs-top-send:disabled{opacity:.35}
.fs-top-send:active{transform:scale(.95)}
.fs-top-send .ic{width:15px;height:15px}
.fs-cnt{min-width:19px;height:19px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.fs-hint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3);font-weight:600;
  border:1px dashed var(--line);border-radius:13px;padding:10px 13px;margin-bottom:10px}
.fs-hint .ic{width:15px;height:15px;flex:none}
.fsrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px;border-radius:14px;
  font-size:14.5px;font-weight:600;transition:background .12s;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.fsrow:active{background:var(--soft)}
.fsrow>b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.1px}
.fsrow .fsize{font:600 10.5px var(--mono);color:var(--tx3);flex:none}
.fb{flex:none;width:37px;height:37px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font:800 11px var(--mono);letter-spacing:.2px;box-shadow:inset 0 -3px 7px rgba(0,0,0,.16),0 3px 9px rgba(0,0,0,.1)}
.fb.mk2{font-size:12.5px}
.fb.mk3{font-size:9.5px}
.fb.dirp{background:none!important;box-shadow:none}
.fb.dirp .ic{width:29px;height:29px}
.sel-tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;
  justify-content:center;color:transparent;transition:.18s;background:#fff}
.sel-tick .ic{width:13px;height:13px;stroke-width:3.2}
.fsrow.picked .sel-tick{background:#000;border-color:#000;color:#fff;animation:tickIn .25s cubic-bezier(.2,.7,.3,1.5)}
@keyframes tickIn{0%{transform:scale(.45)}100%{transform:scale(1)}}
.fsrow.selmode{background:var(--soft2)}
.fs-kids{margin-left:22px;border-left:2px solid var(--hair);padding-left:4px}

/* ===== Panels / viewer ===== */
.panel{position:fixed;inset:0;background:#fff;z-index:70;display:flex;flex-direction:column;opacity:0;transform:translateY(12px);transition:.22s}
.panel.on{opacity:1;transform:none}
.p-top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--hair)}
.p-top b{flex:1;font-size:16.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{flex:1;overflow-y:auto;padding:16px 16px 34px;max-width:640px;width:100%;margin:0 auto}
.p-lead{font-size:13.5px;color:var(--tx2);font-weight:500;margin-bottom:8px}
.p-note{display:flex;gap:10px;border:1px solid var(--hair);border-radius:12px;padding:12px;font-size:12.5px;color:var(--tx2);font-weight:500;line-height:1.6;margin:14px 0}
.p-note .ic{width:16px;height:16px;flex:none;margin-top:2px}
.field{margin:12px 0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:500 14.5px var(--sans);background:#fff;color:var(--tx)}
.inp:focus{outline:none;border-color:#000}
.key-wrap{position:relative}
.key-wrap .inp{padding-right:44px}
.key-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.key-eye .ic{width:17px;height:17px}
.fchk{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;font-weight:600}
.fchk input{width:18px;height:18px;accent-color:#000}
.fchk small{color:var(--tx3);font-weight:500}
.form-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.form-btns .btn{flex:1}
.test-res{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--hair);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px;color:var(--tx2)}
.test-res .ic{width:16px;height:16px;flex:none;margin-top:1px}
.test-res.err{color:var(--red);border-color:#F0C6D2}
.test-res.ok{color:var(--tx);border-color:#000}
.prov-card{border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin:10px 0}
.pc-h{display:flex;align-items:baseline;gap:10px}
.pc-h b{font-size:15px;font-weight:700}
.pc-model{font:700 12px var(--mono);color:var(--tx2);background:var(--soft);border-radius:7px;padding:2px 8px}
.pc-caps{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.cap{font-size:11px;font-weight:700;border:1px solid var(--hair);color:var(--tx3);border-radius:20px;padding:3px 9px}
.cap.on{border-color:#000;color:#000}
.pc-acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.mini-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;
  padding:5px 10px;font-size:12px;font-weight:700;background:#fff}
.mini-btn .ic{width:13px;height:13px}
.mini-btn:hover{border-color:#000}
.mini-btn.danger{color:var(--red);border-color:#F0C6D2}

.model-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--hair);border-radius:13px;padding:12px 13px;margin:7px 0;transition:.15s}
.model-row:hover{border-color:#000}
.model-row.on{border-color:#000;background:var(--soft2)}
.mo-name{flex:1;min-width:0}
.mo-name b{display:block;font-size:14px;font-weight:700}
.mo-name span{font:600 11px var(--mono);color:var(--tx3)}

.viewer{position:fixed;inset:0;background:#fff;z-index:74;display:flex;flex-direction:column;opacity:0;transform:translateY(12px);transition:.22s}
.viewer.on{opacity:1;transform:none}
.v-top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--hair)}
.v-title{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.v-title .fb{width:30px;height:30px;border-radius:9px;font-size:9px}
.v-title b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:8px 11px;font-size:12.5px;font-weight:700;transition:.15s;flex:none}
.v-copy:active{transform:scale(.94)}
.v-copy.done{border-color:#1E7D32;color:#1E7D32;background:#F3FBF5}
.v-copy .ic{width:14px;height:14px}
.v-body{flex:1;min-height:0;display:flex}
.v-code{flex:1;overflow:auto;padding:12px 0 30px}
.cl{display:flex;padding-right:16px}
.cl:hover{background:var(--soft2)}
.ln{flex:none;width:3.4ch;color:#A6A6A6;text-align:right;padding-right:13px;user-select:none;font:12.5px/1.65 var(--mono)}
.lc{font:12.5px/1.65 var(--mono);white-space:pre;tab-size:2}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);
  z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:9px;background:#000;color:#fff;border-radius:13px;padding:10px 15px;
  font-size:13.5px;font-weight:600;max-width:92vw;opacity:0;transform:translateY(8px);transition:.22s;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:none}
.toast .ic{width:16px;height:16px;flex:none}
.toast.err .ic{color:#FF5C82}
.toast.ok .ic{color:#5BE07A}
.spin{width:12px;height:12px;flex:none;border:2px solid var(--line);border-top-color:#000;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>

<script>
'use strict';
/* ================= Flay AI — Android Coding Workspace (fixed) ================= */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const ic=n=>n?`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`:'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const escBr=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtSize=n=>{n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB';};
const fmtRel=ts=>{const d=Date.now()-ts;if(d<60e3)return'Just now';if(d<3600e3)return Math.floor(d/60e3)+'m ago';if(d<86400e3)return Math.floor(d/86400e3)+'d ago';return new Date(ts).toLocaleDateString();};
const getExt=p=>{const m=/\.([a-z0-9]+)$/i.exec(String(p||'').split('/').pop()||'');return m?m[1].toLowerCase():'';};
const baseName=p=>String(p||'file').split('/').pop()||'file';

const dec8=new TextDecoder('utf-8');
const LS={load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const IMG_EXTS=n=>/\.(png|jpe?g|webp|gif|svg|bmp|ico)$/i.test(n);
const TEXT_EXTS=new Set(['html','htm','css','js','mjs','ts','jsx','tsx','json','xml','py','java','kt','gradle','properties','c','h','cpp','hpp','php','sql','md','txt','svg','sh','yml','yaml','ini','cfg']);

/* ---------- state ---------- */
const S={chatId:null,messages:[],chats:LS.load('flay_chats',[]),
  providers:LS.load('flay_providers',[]),projects:LS.load('flay_projects',[]),

/* ---------- quick actions ---------- */

/* ---------- toast ---------- */
function toast(msg,kind='info'){
  const t=el('div','toast '+kind,ic(kind==='err'?'err':kind==='ok'?'ok':'info')+`<span>${esc(msg)}</span>`);
  $('#toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));

}

/* ---------- dialog / sheet / panel ---------- */
function confirmDialog(o){return new Promise(res=>{
  const ov=el('div','ov dlg-ov'),d=el('div','dlg');
  d.innerHTML=`<h3>${esc(o.title)}</h3><div class="dlg-b">${escBr(o.body)}</div>
  <div class="dlg-btns"><button class="btn ghost" data-r="false">${esc(o.cancelLabel||'Cancel')}</button>
  <button class="btn ${o.danger?'danger':''}" data-r="true">${esc(o.okLabel||'Confirm')}</button></div>`;
  ov.appendChild(d);document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('on'));
  d.addEventListener('click',e=>{const b=e.target.closest('button[data-r]');if(!b)return;
    const r=b.dataset.r;ov.classList.remove('on');setTimeout(()=>ov.remove(),200);
    res(r==='true');});});}
function openSheet(o){
  const ov=el('div','ov'),sh=el('div','sheet');
  sh.innerHTML=`<div class="sh-grab"></div><div class="sh-head"><h3>${esc(o.title)}</h3>
  <button class="fbtn sm" aria-label="Close">${ic('close')}</button></div><div class="sh-body"></div>`;
  const body=sh.querySelector('.sh-body');ov.appendChild(sh);document.body.appendChild(ov);
  const close=()=>{ov.classList.remove('on');setTimeout(()=>ov.remove(),200);};
  sh.querySelector('.sh-head button').onclick=close;
  ov.addEventListener('click',e=>{if(e.target===ov)close();});
  requestAnimationFrame(()=>ov.classList.add('on'));
  if(o.build)o.build(body,close);return close;}
function closeSheet(){document.querySelectorAll('.ov').forEach(o=>{if(o.classList.contains('on')){o.classList.remove('on');setTimeout(()=>o.remove(),200);}});}
function mkPanel(title){
  const p=el('div','panel');
  p.innerHTML=`<div class="p-top"><button class="fbtn sm" aria-label="Close">${ic('close')}</button><b>${esc(title)}</b><span class="v-acts" style="display:flex;gap:8px;flex:none"></span></div><div class="p-body"></div>`;
  document.body.appendChild(p);requestAnimationFrame(()=>p.classList.add('on'));
  const close=()=>{p.classList.remove('on');setTimeout(()=>p.remove(),220);};
  p.querySelector('.p-top button').onclick=close;
  return{p,body:p.querySelector('.p-body'),close,acts:p.querySelector('.v-acts')};}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

/* ---------- markdown-lite renderer ---------- */
let CMID=0;const CMAP={};
function renderCodeBox(meta,code){
  const id='c'+(CMID++);CMAP[id]=code.replace(/\n$/,'');
  const mm=(meta||'').trim();
  const lang=mm.split(/[\s:]+/)[0]||'code';
  const pm=/([\w.-]+(?:\/[\w.-]+)*\.\w{1,8})/.exec(mm);
  const label=pm?pm[1]:lang;
  return `<div class="codebox"><div class="cb-head"><span class="cb-lang">${esc(label)}</span><button class="cb-copy" data-cc="${id}">${ic('copy')}<span>Copy</span></button></div><pre><code>${esc(CMAP[id])}</code></pre></div>`;
}
function mdLite(src){
  let s=esc(src);
  if((s.match(/```/g)||[]).length%2===1)s+='\n'+T;
  const stash=[];
  s=s.replace(/```([^\n]*)\n([\s\S]*?)```/g,(m,meta,code)=>{const tok='@@CBX'+stash.length+'@@';stash.push(renderCodeBox(meta,code));return tok;});
  s=s.replace(/^#{1,4}\s+(.*)$/gm,'<span class="md-h">$1</span>')
     .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/`([^`\n]+)`/g,'<code>$1</code>')
     .replace(/^[-*]\s+(.*)$/gm,'<span class="md-li">• $1</span>')
     .replace(/\n/g,'<br>');
  s=s.replace(/@@CBX(\d+)@@/g,(m,i)=>stash[+i]);
  return s;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.cb-copy');if(!b)return;
  const code=CMAP[b.dataset.cc]||'';
  navigator.clipboard.writeText(code).then(()=>{
    b.classList.add('done');b.innerHTML=ic('check')+'<span>Copied</span>';
    setTimeout(()=>{b.classList.remove('done');b.innerHTML=ic('copy')+'<span>Copy</span>';},1600);
  }).catch(()=>toast('Copy failed','err'));
});

/* ---------- chat persistence ---------- */
function saveChat(){
  const last=S.messages[S.messages.length-1];
  if(!last||last.role!=='assistant')return;
  const firstUser=S.messages.find(m=>m.role==='user');
  const title=(firstUser?firstUser.content:'Chat').slice(0,60)||'Chat';
  if(S.chatId){const c=S.chats.find(c=>c.id===S.chatId);if(c){c.messages=S.messages.map(m=>({role:m.role,content:m.content,atts:m.atts}));c.ts=Date.now();}}
  else{S.chatId=uid();S.chats.unshift({id:S.chatId,title,ts:Date.now(),messages:S.messages.map(m=>({role:m.role,content:m.content,atts:m.atts}))});}
  if(S.chats.length>60)S.chats.length=60;
  LS.save('flay_chats',S.chats);renderHist();
}
function resetChat(){
  S.chatId=null;S.messages=[];thread.innerHTML='';
  renderEmptyState();
}
function loadChat(id){

function sysPrompt(){

Current project files:
 ${files}

Rules:
- Keep the package name "${p.pkg}" consistent everywhere.
- Reply with a brief plan, then output every created/modified file using EXACTLY this format:
 ${T}${p.tech==='Java Native'?'java':p.tech==='HTML / Web'?'html':'kotlin'}:app/src/main/java/.../FileName.ext
<complete file code>
 ${T}
- The file path MUST come right after the language, separated by ":".
- For HTML / Web stack use paths under app/src/main/assets/ for web files.
- Never omit code with comments like "unchanged". Output complete files only.`;
  }
  return 'You are Flay AI, an expert senior coding assistant. Reply in clear markdown with concise explanations. When producing files, use fenced code blocks with the language and, when relevant, the file path after the language separated by ":".';
}
function buildAPIMessages(){
  const msgs=[{role:'system',content:sysPrompt()}];
  const hist=S.messages.slice(-16);
  hist.forEach(m=>{
    let content=m.content||'';
    if(m.role==='user'&&m.extra)content+='\n\n'+m.extra;
    msgs.push({role:m.role,content});
  });
  return msgs;
}
const ANVIL_PROXY_URL=window.ANVIL_PROXY_URL||'https://flayai-agent.flaynity.workers.dev';
async function callProvider(msgs,{onDelta}={}){
  const p=getProvider();
  if(!p){const e=new Error('No AI provider configured. Open Menu → Set Up AI.');e.code='nop';throw e;}
  const url=ANVIL_PROXY_URL.replace(/\\/+$/,'')+'/v1/chat/completions';
  const target=p.url.replace(/\\/+$/,'');
  const ctl=new AbortController();S.abort=()=>ctl.abort();
  const doStream=!!onDelta&&capOf(p).streaming!==false;
  const res=await fetch(url,{method:'POST',signal:ctl.signal,
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+p.key,'X-Target-URL':target,'X-Provider-URL':target,'X-Provider-Key':p.key},
    body:JSON.stringify({model:p.model,messages:msgs,stream:doStream,temperature:.7})});
  if(!res.ok){const t=await res.text().catch(()=>'');throw new Error('Proxy HTTP '+res.status+' — '+t.slice(0,220));}
  if(!doStream){const j=await res.json();const c=j.choices?.[0]?.message?.content||'';onDelta&&onDelta(c);return c;}
  const rd=res.body.getReader();let buf='',acc='';
  while(true){const{done,value}=await rd.read();if(done)break;
    buf+=dec8.decode(value,{stream:true});
    const lines=buf.split('\\n');buf=lines.pop();
    for(const ln of lines){const t=ln.trim();if(!t.startsWith('data:'))continue;
      const d=t.slice(5).trim();if(d==='[DONE]')continue;
      try{const j=JSON.parse(d);const dl2=j.choices?.[0]?.delta?.content||j.choices?.[0]?.delta?.reasoning_content||'';
        if(dl2){acc+=dl2;onDelta(dl2);}}catch{}}
  }
  return acc;
}

async function send(){
  if(S.streaming){S.abort&&S.abort();return;}
  const text=inp.value.trim();
  const atts=S.attachments.slice();
  if(!text&&!atts.length)return;
  const p=getProvider();
  if(!p){toast('Set up an AI provider first','err');openProviderSetup();return;}
  hideEmpty();
  let extra='';
  atts.forEach(a=>{
    if(a.kind==='code'&&a.text)extra+=`\n\nFile "${a.path||a.name}":\n${T}\n${a.text}\n${T}`;
    else if(a.kind==='file'&&a.text)extra+=`\n\nFile "${a.name}":\n${T}\n${a.text}\n${T}`;
    else if(a.kind==='img')extra+=`\n[Image attached: ${a.name}]`;
  });
  const um={role:'user',content:text||'(files)',atts:atts.map(a=>({kind:a.kind,name:a.name,dataUrl:a.dataUrl})),extra};
  S.messages.push(um);renderUser(um);
  inp.value='';autoGrow();S.attachments=[];renderAttach();
  scrollBottom(true);
  S.streaming=true;btnSend.classList.add('stream');btnSend.innerHTML=ic('stop');
  const am=el('div','msg ai');
  am.innerHTML=`<div class="ai-main"><div class="think-row">${ic('spark')}<span>${S.isAndroidMode?'Engineering your Android project':'Thinking'}<span class="caret"></span></span></div></div>`;
  thread.appendChild(am);scrollBottom();
  let acc='',last=0;
  const paint=final=>{
    const main=am.querySelector('.ai-main');
    main.innerHTML=`<div class="seg-t">${mdLite(acc)}${final?'':'<span class="caret"></span>'}</div>`;
    scrollBottom();
  };
  try{
    await callProvider(buildAPIMessages(),{onDelta:d=>{
      acc+=d;const now=Date.now();
      if(now-last>90){last=now;paint(false);}
    }});
    if(!acc.trim())acc='(empty response)';
    const ai={role:'assistant',content:acc};
    S.messages.push(ai);paint(true);
    if(S.isAndroidMode)applyExtractedFiles(acc);
    saveChat();scrollBottom();
  }catch(err){
    const main=am.querySelector('.ai-main');
    if(acc.trim()){S.messages.push({role:'assistant',content:acc});paint(true);if(S.isAndroidMode)applyExtractedFiles(acc);saveChat();}
    else main.innerHTML=`<div class="err-card">${ic('err')}<div class="ec-t"><b>Request failed</b><p>${esc(String(err.message||err))}</p></div></div>`;
  }finally{
    S.streaming=false;S.abort=null;
    btnSend.classList.remove('stream');btnSend.innerHTML=ic('send');
  }
}

/* ---------- extract project files from AI output ---------- */
function extractFiles(text){
  const out={};const F3=T;
  const fence=new RegExp(F3+'([^\\n]*)\\n([\\s\\S]*?)'+F3,'g');
  const hintRe=/(?:file|path)\s*[:=]\s*([\w.\-/]+\.\w{1,8})/i;
  const bareRe=/^[\s`]*([\w.-]+(?:\/[\w.-]+)+\.\w{1,8})[\s`]*:?$/;
  let prevLine='';
  text.split('\n').forEach(line=>{
    const h=hintRe.exec(line);if(h)prevLine=h[1];
    const b=bareRe.exec(line.trim());if(b)prevLine=b[1];
  });
  let m;
  while((m=fence.exec(text))!==null){
    const meta=(m[1]||'').trim();const code=m[2];
    let path=null;
    const pm=/([\w.-]+(?:\/[\w.-]+)*\.\w{1,8})/.exec(meta);
    if(pm&&(meta.includes('/')||/^(app|settings|build)/.test(pm[1])))path=pm[1];
    if(!path&&prevLine&&/^[\w.-]+(\/[\w.-]+)*\.\w{1,8}$/.test(prevLine))path=prevLine;
    if(path&&!/[<>"]/.test(path))out[path]=code.replace(/\n$/,'')+'\n';
  }
  return out;
}
function applyExtractedFiles(text){
  if(!S.project)return;
  const files=extractFiles(text);
  const n=Object.keys(files).length;
  if(!n)return;
  Object.assign(S.project.files,files);
  S.project.updated=Date.now();
  upsertProject();toast(n+' file'+(n>1?'s':'')+' updated in App Code Root','ok');
}

/* ---------- project storage ---------- */
function upsertProject(){
  if(!S.project)return;
  const i=S.projects.findIndex(p=>p.id===S.project.id);
  if(i>=0)S.projects[i]={...S.project};else S.projects.unshift({...S.project});
  LS.save('flay_projects',S.projects);
}

function buildTree(files){
  const root={};
  Object.keys(files).sort().forEach(p=>{
    const parts=p.split('/');let n=root;
    parts.forEach((seg,i)=>{
      if(i===parts.length-1)n[seg]={__f:p};
      else{n[seg]=n[seg]||{};n=n[seg];}
    });
  });
  return root;
}
function openFsPage(){
  if(!S.project){toast('No active Android project','err');return;}
  S.fsSel=new Set();S.fsSelMode=false;
  const P=mkPanel('App Code Root');
  const sendBtn=el('button','fs-top-send');
  sendBtn.disabled=true;
  sendBtn.innerHTML=`${ic('send')}<span style="margin:0 3px">Send to AI Composer</span>`;
  const cnt=el('span','fs-cnt','0');
  sendBtn.appendChild(cnt);
  P.acts.appendChild(sendBtn);
  P.body.innerHTML=`<div class="fs-hint">${ic('info')}<span><b>Tap</b> a file to open its code · <b>Hold</b> a file to select it, tap again to unselect.</span></div><div id="fsTree"></div>`;
  const treeEl=P.body.querySelector('#fsTree');
  const expanded=new Set();
  const updateSend=()=>{cnt.textContent=String(S.fsSel.size);sendBtn.disabled=S.fsSel.size===0;};

  const wireFileRow=(row,path)=>{
    let holdT=null,fired=false;
    const startHold=()=>{fired=false;holdT=setTimeout(()=>{
      fired=true;
      S.fsSelMode=true;
      S.fsSel.has(path)?S.fsSel.delete(path):S.fsSel.add(path);
      render();
    },430);};
    const cancel=()=>clearTimeout(holdT);
    row.addEventListener('pointerdown',startHold);
    row.addEventListener('pointerup',()=>{
      cancel();
      if(fired)return;
      if(S.fsSelMode){
        S.fsSel.has(path)?S.fsSel.delete(path):S.fsSel.add(path);
        row.classList.toggle('picked');
        updateSend();
      }else openFileViewer(path);
    });
    row.addEventListener('pointerleave',cancel);
    row.addEventListener('pointercancel',cancel);
    row.addEventListener('contextmenu',e=>e.preventDefault());
  };

  const renderNode=(node,depth,container,parentKey)=>{
    Object.keys(node).sort((a,b)=>{
      const fa=!!node[a].__f,fb=!!node[b].__f;
      if(fa!==fb)return fa?1:-1;
      return a.localeCompare(b);
    }).forEach(k=>{
      const v=node[k];
      const key=parentKey?parentKey+'/'+k:k;
      const isFile=!!v.__f;
      const row=el('button','fsrow');
      row.style.paddingLeft=(8+depth*16)+'px';
      if(isFile){
        const path=v.__f;
        row.innerHTML=`${fbTile(k,false)}<b>${esc(k)}</b><span class="fsize">${fmtSize((S.project.files[path]||'').length)}</span><span class="sel-tick">${ic('check')}</span>`;
        if(S.fsSelMode)row.classList.add('selmode');
        if(S.fsSel.has(path))row.classList.add('picked');
        wireFileRow(row,path);
      }else{
        const open=expanded.has(key);
        row.innerHTML=`${fbTile('',true)}<b>${esc(k)}</b>`;
        const chev=el('span','',ic('chev-d'));
        chev.style.cssText='margin-left:auto;display:flex;color:#9A9A9A;transition:transform .18s;transform:rotate('+(open?'180deg':'0deg')+')';
        row.appendChild(chev);
        row.onclick=()=>{expanded.has(key)?expanded.delete(key):expanded.add(key);render();};
      }
      container.appendChild(row);
      if(!isFile&&expanded.has(key)){
        const kids=el('div','fs-kids');
        container.appendChild(kids);
        renderNode(v,depth+1,kids,key);
      }
    });
  };

  const render=()=>{
    treeEl.innerHTML='';
    renderNode(buildTree(S.project.files),0,treeEl,'');
    updateSend();
  };
  sendBtn.onclick=()=>{
    if(!S.fsSel.size){toast('Hold files to select first');return;}
    let n=0;
    S.fsSel.forEach(path=>{
      S.attachments.push({id:uid(),kind:'code',name:baseName(path),path,text:S.project.files[path]||'',size:(S.project.files[path]||'').length});
      n++;
    });
    renderAttach();
    P.close();
    toast(n+' file'+(n>1?'s':'')+' tagged in AI Composer','ok');
  };
  render();
}
/* File viewer — Top bar: X close + file name + Copy button */
function openFileViewer(path){
  const content=S.project.files[path]||'';
  const v=el('div','viewer');
  v.innerHTML=`
  <div class="v-top">
    <button class="fbtn sm" aria-label="Close">${ic('close')}</button>
    <div class="v-title">${fbTile(baseName(path),false)}<b>${esc(path)}</b></div>
    <button class="v-copy">${ic('copy')}<span>Copy</span></button>
  </div>
  <div class="v-body"><div class="v-code">${content.split('\n').map((l,i)=>`<div class="cl"><span class="ln">${i+1}</span><span class="lc">${esc(l)||' '}</span></div>`).join('')}</div></div>`;
  document.body.appendChild(v);
  requestAnimationFrame(()=>v.classList.add('on'));
  const close=()=>{v.classList.remove('on');setTimeout(()=>v.remove(),220);};
  v.querySelector('.fbtn').onclick=close;
  v.querySelector('.v-copy').onclick=function(){
    navigator.clipboard.writeText(content).then(()=>{
      this.classList.add('done');this.innerHTML=ic('check')+'<span>Copied</span>';
      setTimeout(()=>{this.classList.remove('done');this.innerHTML=ic('copy')+'<span>Copy</span>';},1600);
    }).catch(()=>toast('Copy failed','err'));
  };
}

async function exportZip(p){
  if(window.JSZip){
    try{
      const zip=new JSZip();
      Object.entries(p.files).forEach(([path,c])=>zip.file(path,c));
      zip.file('flay-project.json',JSON.stringify({name:p.name,package:p.pkg,tech:p.tech,exported:new Date().toISOString()},null,2));
      const blob=await zip.generateAsync({type:'blob'});
      dl((p.pkg||p.name||'project')+'.zip',blob);
      toast('Project exported as ZIP','ok');return;
    }catch(e){}
  }
  const txt=Object.entries(p.files).map(([path,c])=>`===== ${path} =====\n${c}`).join('\n\n');
  dl((p.pkg||'project')+'-code.txt',new Blob([txt],{type:'text/plain'}));
  toast('Project exported','ok');
}

document.addEventListener('click',e=>{
  const pop=$('#attachPop');
  if(!pop.hidden&&!e.target.closest('#attachPop')&&!e.target.closest('#btnPlus')){pop.classList.remove('on');setTimeout(()=>pop.hidden=true,160);}
});
 $('#attachPop').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const pop=$('#attachPop');pop.classList.remove('on');setTimeout(()=>pop.hidden=true,160);
  if(b.dataset.a==='photo')$('#filePhoto').click();
  else if(b.dataset.a==='file')$('#filePick').click();
  else toast('Plugins coming soon');
});
 $('#pillModel').onclick=openModelSheet;
const MODES=['Balanced','Deep Reasoning','Fast'];
 $('#pillReason').onclick=()=>{
  const i=(MODES.indexOf(S.reasoningMode)+1)%MODES.length;
  S.reasoningMode=MODES[i];$('#prLabel').textContent=S.reasoningMode;
  toast('Reasoning: '+S.reasoningMode);
};
function updatePills(){
  const p=getProvider();
  $('#pmLabel').textContent=p?p.name+' · '+p.model.split('/').pop().slice(0,14):'Model';
}
function renderAttach(){
  const row=$('#attachRow');
  if(!S.attachments.length){row.hidden=true;row.innerHTML='';return;}
  row.hidden=false;row.innerHTML='';
  S.attachments.forEach(a=>{
    const c=el('div','att-chip'+(a.kind==='code'?' am-chip':''));
    c.innerHTML=(a.kind==='img'?`<img class="att-th" src="${a.dataUrl}" alt="">`
      :a.kind==='code'?`<span class="att-ic am">${esc(getExt(a.name).toUpperCase().slice(0,3)||'F')}</span>`
      :`<span class="att-ic">${ic('doc')}</span>`)
      +`<div class="att-m"><b>${esc(a.name)}</b><span>${a.kind==='code'?'AI Composer tag':fmtSize(a.size||0)}</span></div>
      <button class="att-x">${ic('close')}</button>`;
    c.querySelector('.att-x').onclick=()=>{S.attachments=S.attachments.filter(x=>x.id!==a.id);renderAttach();};
    row.appendChild(c);
  });
}
/* file inputs */
 $('#filePhoto').onchange=e=>{
  [...e.target.files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{S.attachments.push({id:uid(),kind:'img',name:f.name,dataUrl:r.result,size:f.size});renderAttach();};
    r.readAsDataURL(f);
  });
  e.target.value='';
};
 $('#filePick').onchange=e=>{
  [...e.target.files].forEach(f=>{
    const ext=getExt(f.name);
    if(IMG_EXTS(f.name)){
      const r=new FileReader();
      r.onload=()=>{S.attachments.push({id:uid(),kind:'img',name:f.name,dataUrl:r.result,size:f.size});renderAttach();};
      r.readAsDataURL(f);return;
    }
    if(ext==='zip'){
      if(window.JSZip){
        JSZip.loadAsync(f).then(z=>{
          let n=0;
          Object.keys(z.files).forEach(path=>{
            if(z.files[path].dir||n>=12)return;
            const ex=getExt(path);
            if(TEXT_EXTS.has(ex)){
              z.files[path].async('string').then(txt=>{
                S.attachments.push({id:uid(),kind:'code',name:baseName(path),path,text:txt,size:txt.length});
                renderAttach();
              });n++;
            }});
          toast('ZIP contents attached');
        }).catch(()=>toast('Could not read ZIP','err'));
      }else toast('ZIP reader unavailable','err');
      return;
    }
    if(TEXT_EXTS.has(ext)||f.size<400000){
      const r=new FileReader();
      r.onload=()=>{S.attachments.push({id:uid(),kind:'file',name:f.name,text:r.result,size:f.size});renderAttach();};
      r.readAsText(f);
    }else{S.attachments.push({id:uid(),kind:'file',name:f.name,size:f.size});renderAttach();}
  });
  e.target.value='';
};

/* ---------- init ---------- */
(function init(){
  updatePills();$('#prLabel').textContent=S.reasoningMode;
  renderEmptyState();
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      closeSheet();closeDrawer();
      document.querySelectorAll('.scrim,.pop3').forEach(x=>x.remove());
    }
  });
})();
</script>
</body>
</html>
