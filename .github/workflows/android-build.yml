name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: "Android project directory inside the repository"
        required: false
        default: "."
        type: string
      build_type:
        description: "APK build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create WebView Android project from index.html
        shell: bash
        run: |
          rm -rf android-build
          mkdir -p android-build/app/src/main/assets
          mkdir -p android-build/app/src/main/java/com/flaynity/flayai
          mkdir -p android-build/app/src/main/res/values

          cp -R ./. android-build/app/src/main/assets/
          rm -rf android-build/app/src/main/assets/android-build
          rm -rf android-build/app/src/main/assets/.git
          rm -rf android-build/app/src/main/assets/.github

          if [ ! -f "index.html" ]; then
            echo "index.html was not found in the repository root."
            exit 1
          fi

          cat > android-build/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "FlayAI"
include(":app")
EOF

          cat > android-build/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > android-build/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flaynity.flayai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flaynity.flayai'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:theme="@style/AppTheme"
        android:label="Flay AI"
        android:usesCleartextTraffic="true"
        android:hardwareAccelerated="true">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

          cat > android-build/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#000000</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:statusBarColor">#000000</item>
        <item name="android:windowLightStatusBar">false</item>
    </style>
</resources>
EOF

          cat > android-build/app/src/main/java/com/flaynity/flayai/MainActivity.java <<'EOF'
package com.flaynity.flayai;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        setContentView(webView);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
        settings.setMediaPlaybackRequiresUserGesture(false);

        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());
        webView.loadUrl("file:///android_asset/index.html");
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
EOF

      - name: Build WebView APK
        working-directory: android-build
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p build-output
          find "android-build" -type f -name "*.apk" -print
          apk="$(find "android-build" -type f -name "*.apk" | grep -E '/(debug|release)/' | head -n 1)"
          if [ -z "$apk" ]; then
            apk="$(find "android-build" -type f -name "*.apk" | head -n 1)"
          fi
          if [ -z "$apk" ]; then
            echo "APK was not produced."
            exit 1
          fi
          cp "$apk" build-output/Flay-AI.apk
          ls -lh build-output/Flay-AI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flay-ai-apk
          path: build-output/Flay-AI.apk
          if-no-files-found: error
          retention-days: 7
